<script>
/* ============================================================
   ENFOQUE — lógica de la app
   ============================================================ */
const KEY = 'enfoque.v1';
const DEF = {done:{}, checks:{}, grades:{}, tools:{}, theme:'dark'};
let S = load();

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return JSON.parse(JSON.stringify(DEF));
    const o = JSON.parse(raw);
    return Object.assign(JSON.parse(JSON.stringify(DEF)), o);
  }catch(e){ return JSON.parse(JSON.stringify(DEF)); }
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ /* modo privado o almacenamiento bloqueado: la app sigue funcionando */ }
}
const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

let toastT;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove('on'), 2200);
}

/* ---------- tema ---------- */
function applyTheme(){
  document.documentElement.setAttribute('data-theme', S.theme === 'light' ? 'light' : 'dark');
  const m = document.querySelector('meta[name=theme-color]');
  if(m) m.setAttribute('content', S.theme === 'light' ? '#f6f7f9' : '#0d0f12');
}
$('#theme').onclick = ()=>{ S.theme = S.theme === 'light' ? 'dark' : 'light'; save(); applyTheme(); };
applyTheme();

/* ---------- navegación ---------- */
let cur = 'curso', stack = [];
function go(page, opt){
  stack.push(cur);
  show(page, opt);
}
function show(page, opt){
  cur = page;
  $$('.page').forEach(p=>p.classList.remove('on'));
  $('#p-' + page).classList.add('on');
  $$('.nav button').forEach(b=>b.classList.toggle('on', b.dataset.go === page));
  const deep = (page === 'leccion' || page === 'tool');
  $('#back').style.display = deep ? 'grid' : 'none';
  if(page === 'curso'){ $('#title').textContent = 'Enfoque'; renderCurso(); }
  if(page === 'tools'){ $('#title').textContent = 'Herramientas'; renderTools(); }
  if(page === 'estado'){ $('#title').textContent = 'Estado del curso'; renderEstado(); }
  if(page === 'leccion'){ renderLeccion(opt); }
  if(page === 'tool'){ renderTool(opt); }
  window.scrollTo(0,0);
}
$$('.nav button').forEach(b=> b.onclick = ()=>{ stack = []; show(b.dataset.go); });
$('#back').onclick = ()=>{ const p = stack.pop() || 'curso'; show(p); };

/* ---------- utilidades de progreso ---------- */
const readyCount = LESSONS.filter(l=>l.ready).length;
const doneCount  = ()=> Object.keys(S.done).filter(k=>S.done[k]).length;
const nextLesson = ()=> LESSONS.find(l => l.ready && !S.done[l.n]) || LESSONS.find(l=>!S.done[l.n]);

/* ============================================================
   PANTALLA: CURSO
   ============================================================ */
function renderCurso(){
  const d = doneCount(), pct = Math.round(d / LESSONS.length * 100);
  const nx = nextLesson();
  let h = `
  <div class="hero">
    <div class="k">Curso de fotografía · Galaxy S25+</div>
    <div class="big">De cero a experto</div>
    <p class="tiny" style="margin:4px 0 0">Paisajes y retratos. 26 lecciones en 4 niveles, a tu ritmo.</p>
    <div class="stats">
      <div class="stat"><b>${d}</b><span>Hechas</span></div>
      <div class="stat"><b>${LESSONS.length}</b><span>Totales</span></div>
      <div class="stat"><b>${pct}%</b><span>Avance</span></div>
    </div>
    <div class="bar" style="margin-top:13px"><i style="width:${pct}%"></i></div>
  </div>`;

  if(nx){
    h += `<button class="btn" id="cont" style="margin-bottom:18px">
      ${d ? 'Continuar' : 'Empezar'} · Lección ${nx.n}: ${esc(nx.title)} →</button>`;
  }else{
    h += `<div class="card" style="text-align:center"><p style="margin:0">🏆 Completaste todas las lecciones disponibles.</p></div>`;
  }

  LEVELS.forEach(lv=>{
    const ls = LESSONS.filter(l=>l.lvl===lv.id);
    const dn = ls.filter(l=>S.done[l.n]).length;
    h += `<div class="lvl">
      <span class="dot" style="background:var(--${lv.color})"></span>
      <h2>${esc(lv.name)}</h2>
      <small>${dn}/${ls.length}</small>
    </div>
    <p class="tiny" style="margin:-6px 0 10px 18px">${esc(lv.sub)}</p>`;
    ls.forEach(l=>{
      const done = !!S.done[l.n];
      h += `<button class="les ${done?'done':''} ${l.ready?'':'soon'}" data-n="${l.n}">
        <span class="num">${done?'✓':l.n}</span>
        <span class="t"><b>${esc(l.title)}</b><span>${esc(l.dur)}${l.ready?'':' · se dicta más adelante'}</span></span>
        <span class="go">›</span>
      </button>`;
    });
  });

  h += `<div class="card" style="margin-top:20px">
    <h3 style="margin-top:0">Cómo usar esta app</h3>
    <ul class="tiny" style="margin-bottom:0">
      <li>Las lecciones del Nivel 1 están completas. Las demás muestran su objetivo y se van escribiendo a medida que avanzamos en el chat.</li>
      <li>Al final de cada lección hay una tarea. Subí las fotos al chat y te las evalúo con la rúbrica de 6 criterios.</li>
      <li>En <strong>Estado</strong> podés anotar tus notas y generar un resumen para retomar el curso en otra conversación.</li>
      <li>Todo se guarda en tu teléfono. No se envía nada a ningún servidor.</li>
    </ul>
  </div>`;

  $('#v-curso').innerHTML = h;
  const c = $('#cont'); if(c) c.onclick = ()=>go('leccion', nx.n);
  $$('#v-curso .les').forEach(b=> b.onclick = ()=>go('leccion', +b.dataset.n));
}

/* ============================================================
   PANTALLA: LECCIÓN
   ============================================================ */
function renderLeccion(n){
  const l = LESSONS.find(x=>x.n===n); if(!l) return;
  const lv = LEVELS.find(v=>v.id===l.lvl);
  $('#title').textContent = 'Lección ' + l.n;
  const done = !!S.done[l.n];

  let h = `<span class="pill ${lv.color}">${esc(lv.name)}</span>
  <h2 style="margin:10px 0 4px">${esc(l.title)}</h2>
  <p class="tiny" style="margin-bottom:16px">Duración estimada: ${esc(l.dur)}</p>

  <div class="sec" open><div class="secbody" style="padding:15px">
    <div class="eng" style="background:color-mix(in srgb,var(--accent) 11%,transparent);border-color:color-mix(in srgb,var(--accent) 32%,transparent)">
      <div class="h" style="color:var(--accent)">🎯 Objetivo</div>
      <p style="margin:0">${l.obj}</p>
    </div>
  </div></div>`;

  if(!l.ready){
    h += `<div class="card">
      <h3 style="margin-top:0">Qué vamos a ver</h3>
      <ul>${l.preview.map(p=>`<li>${p}</li>`).join('')}</ul>
      <div class="note"><p>Esta lección todavía no está escrita. Se dicta cuando termines la anterior y entregues su evaluación: así el contenido se ajusta a lo que ya dominás y a lo que haya que reforzar.</p></div>
    </div>`;
    h += navBtns(l);
    $('#v-leccion').innerHTML = h;
    wireNav(l);
    return;
  }

  h += sec('📖','Teoría', l.teoria + (l.eng ? `<div class="eng"><div class="h">⚙️ Para el ingeniero</div>${l.eng}</div>` : ''), true);

  /* videos y lecturas */
  let vh = '';
  if(l.videos && l.videos.length){
    vh += l.videos.map(v=>`<a class="vid" href="${v.url}" target="_blank" rel="noopener">
      <b>▶ ${esc(v.title)}</b><div class="meta">${esc(v.meta)}</div>
      <div class="look"><strong>Qué mirar:</strong> ${v.look}</div></a>`).join('');
  }
  if(l.reads && l.reads.length){
    vh += l.reads.map(v=>`<a class="vid" href="${v.url}" target="_blank" rel="noopener">
      <b>📄 ${esc(v.title)}</b><div class="meta">${esc(v.meta)}</div>
      <div class="look"><strong>Qué mirar:</strong> ${v.look}</div></a>`).join('');
  }
  if(!l.videos.length && (!l.reads || !l.reads.length)){
    vh += `<div class="note"><p>Para esta lección no encontré un video en español que fuera específico y confiable, así que no te doy ninguno inventado. Usá los términos de búsqueda de abajo.</p></div>`;
  }
  if(l.searches && l.searches.length){
    vh += `<h3>Buscá vos en YouTube</h3>
    <p class="tiny">Estos son los términos exactos que yo buscaría. Los pongo en lugar de inventar un enlace.</p>` +
    l.searches.map(s=>`<div class="searchbox">${esc(s.why)}<span class="q">${esc(s.q)}</span></div>`).join('');
  }
  vh += `<p class="tiny" style="margin-top:12px">⚠️ No pude abrir las páginas de YouTube para confirmar canal y duración de cada video, así que esos datos van marcados como sin verificar. Los enlaces sí provienen de búsquedas reales; ninguno está inventado.</p>`;
  h += sec('🎬','Videos', vh);

  h += sec('📱','Práctica guiada en el S25+',
    `<ol class="steps">${l.practica.map(p=>`<li>${p}</li>`).join('')}</ol>
     <p class="tiny">Los nombres de menú van en inglés porque tu teléfono está en inglés. En One UI 8.5 algunos ajustes cambiaron de lugar: si no encontrás uno, mandame una captura y te digo dónde quedó.</p>`);

  h += sec('⚠️','Errores comunes',
    `<div class="tw"><table><thead><tr><th>Error</th><th>Causa</th><th>Solución</th></tr></thead><tbody>
     ${l.errores.map(e=>`<tr><td><strong>${e[0]}</strong></td><td>${e[1]}</td><td>${e[2]}</td></tr>`).join('')}
     </tbody></table></div>`);

  if(l.tool){
    const t = TOOLS.find(x=>x.id===l.tool);
    h += sec('🎛️','Herramienta de apoyo',
      `<button class="toolcard" id="lt" style="margin:0">
        <span class="em">${t.em}</span>
        <span class="t"><b>${esc(t.name)}</b><span>${esc(t.desc)}</span></span>
        <span class="go" style="color:var(--faint);font-size:17px">›</span>
      </button>`);
  }

  h += sec('🎓','Evaluación', l.evaluacion);

  /* checklist */
  const ck = S.checks[l.n] || [];
  h += sec('✅','Resumen y checklist',
    l.checklist.map((c,i)=>`<div class="ck">
      <input type="checkbox" id="ck${l.n}_${i}" data-i="${i}" ${ck[i]?'checked':''}>
      <label for="ck${l.n}_${i}">${c}</label></div>`).join(''), true);

  h += `<div class="card">
    <h3 style="margin-top:0">Tu nota en esta lección</h3>
    <p class="tiny">Cuando te devuelva la evaluación en el chat, anotá acá el promedio. Sirve para el resumen del estado del curso.</p>
    <div class="grade">
      <select id="gsel">
        <option value="">Sin nota todavía</option>
        ${[10,9.5,9,8.5,8,7.5,7,6.5,6,5.5,5,4.5,4,3.5,3].map(v=>`<option value="${v}" ${S.grades[l.n]&&S.grades[l.n].nota==v?'selected':''}>${v}</option>`).join('')}
      </select>
    </div>
    <textarea id="gnot" rows="3" placeholder="Puntos a reforzar, según la devolución...">${S.grades[l.n]?esc(S.grades[l.n].notas||''):''}</textarea>
  </div>`;

  h += `<button class="btn ${done?'ghost':''}" id="mark" style="margin-bottom:10px">
    ${done ? '✓ Lección completada · toca para desmarcar' : 'Marcar lección como completada'}</button>`;
  h += navBtns(l);

  $('#v-leccion').innerHTML = h;

  const tb = $('#tbl-lentes');
  if(tb) tb.innerHTML = PHONE.lentes.map(r=>`<tr>${r.map((c,i)=>`<td>${i===0?'<strong>'+c+'</strong>':c}</td>`).join('')}</tr>`).join('');

  $$('#v-leccion .ck input').forEach(inp=> inp.onchange = ()=>{
    const arr = S.checks[l.n] || [];
    arr[+inp.dataset.i] = inp.checked;
    S.checks[l.n] = arr; save();
  });
  $('#gsel').onchange = e=>{
    S.grades[l.n] = S.grades[l.n] || {};
    S.grades[l.n].nota = e.target.value ? parseFloat(e.target.value) : null;
    save(); toast(e.target.value ? 'Nota guardada: ' + e.target.value : 'Nota borrada');
  };
  $('#gnot').oninput = e=>{
    S.grades[l.n] = S.grades[l.n] || {};
    S.grades[l.n].notas = e.target.value; save();
  };
  $('#mark').onclick = ()=>{
    S.done[l.n] = !S.done[l.n]; save();
    toast(S.done[l.n] ? '✓ Lección ' + l.n + ' completada' : 'Lección ' + l.n + ' desmarcada');
    renderLeccion(l.n);
  };
  const lt = $('#lt'); if(lt) lt.onclick = ()=>go('tool', l.tool);
  wireNav(l);
}
function sec(ic, t, body, open){
  return `<details class="sec" ${open?'open':''}><summary><span class="ic">${ic}</span>${t}</summary>
    <div class="secbody">${body}</div></details>`;
}
function navBtns(l){
  const prev = LESSONS.find(x=>x.n===l.n-1), next = LESSONS.find(x=>x.n===l.n+1);
  return `<div class="row" style="margin-top:6px">
    ${prev?`<button class="btn ghost" data-nav="${prev.n}">‹ Lección ${prev.n}</button>`:''}
    ${next?`<button class="btn ghost" data-nav="${next.n}">Lección ${next.n} ›</button>`:''}
  </div>`;
}
function wireNav(l){
  $$('#v-leccion [data-nav]').forEach(b=> b.onclick = ()=>renderLeccion(+b.dataset.nav));
}

/* ============================================================
   PANTALLA: HERRAMIENTAS
   ============================================================ */
function renderTools(){
  let h = `<p class="tiny" style="margin-bottom:16px">Herramientas para entender los conceptos con las manos. Todas funcionan sin conexión.</p>`;
  h += TOOLS.map(t=>`<button class="toolcard" data-t="${t.id}">
    <span class="em">${t.em}</span>
    <span class="t"><b>${esc(t.name)}</b><span>${esc(t.desc)}</span><span style="color:var(--faint);font-size:11.5px;margin-top:3px">${esc(t.les)}</span></span>
    <span class="go" style="color:var(--faint);font-size:17px">›</span>
  </button>`).join('');
  $('#v-tools').innerHTML = h;
  $$('#v-tools .toolcard').forEach(b=> b.onclick = ()=>go('tool', b.dataset.t));
}

/* Un AbortController por herramienta: al salir de una, se dan de baja sus
   escuchas de resize. Sin esto, los listeners viejos siguen disparando sobre
   canvas que ya no están en el DOM. */
let toolAC = null;
function renderTool(id){
  const t = TOOLS.find(x=>x.id===id);
  if(toolAC) toolAC.abort();
  toolAC = new AbortController();
  $('#title').textContent = t.name;
  $('#v-tool').innerHTML = '';
  ({expo:toolExpo, color:toolColor, wb:toolWB, grids:toolGrids, check:toolCheck})[id]($('#v-tool'));
}
/* ¿el canvas sigue vivo y con ancho medible? */
const alive = el => !!(el && el.isConnected && el.clientWidth > 0);
const onResize = fn => window.addEventListener('resize', fn, {passive:true, signal:toolAC.signal});

/* ------------------------------------------------------------
   HERRAMIENTA 1 · Simulador de exposición
   ------------------------------------------------------------ */
function toolExpo(root){
  const ISOS = [50,100,200,400,800,1600,3200];
  const SH = [
    [1/2000,'1/2000'],[1/1000,'1/1000'],[1/500,'1/500'],[1/250,'1/250'],[1/125,'1/125'],
    [1/60,'1/60'],[1/30,'1/30'],[1/15,'1/15'],[1/8,'1/8'],[1/4,'1/4'],[1/2,'1/2'],[1,'1 s']
  ];
  const SCENES = {
    dia:      {n:'Día soleado',  iso:100, t:1/500, sky:['#3f7fd0','#a8cdf0'], amb:1.0},
    nublado:  {n:'Nublado',      iso:200, t:1/250, sky:['#8894a2','#c3ccd6'], amb:0.9},
    interior: {n:'Interior',     iso:800, t:1/60,  sky:['#4a4238','#6d6152'], amb:0.55},
    noche:    {n:'Noche',        iso:3200,t:1/15,  sky:['#0b1020','#1d2740'], amb:0.3}
  };
  const MOT = {quieto:{n:'Quieto',v:0}, caminando:{n:'Caminando',v:1}, corriendo:{n:'Corriendo',v:3.2}};

  let st = {scene:'dia', iso:1, sh:2, ev:0, mot:'quieto', ois:true};

  root.innerHTML = `
  <p class="tiny">Tu S25+ tiene apertura fija, así que sólo podés mover <strong>dos</strong> variables: ISO y velocidad. Cada paso que ganás en brillo lo pagás en ruido o en movimiento borroso. Movelas y mirá el precio.</p>
  <canvas class="cv" id="ex-cv" style="aspect-ratio:4/3"></canvas>
  <div class="readout">
    <div><b id="ex-st">0.0</b><span>Pasos EV</span></div>
    <div><b id="ex-no">—</b><span>Ruido</span></div>
    <div><b id="ex-bl">—</b><span>Movimiento</span></div>
  </div>
  <div class="verdict" id="ex-vd"></div>
  <div class="ctl"><div class="lab">Escena<span id="ex-scn"></span></div>
    <div class="seg" id="ex-scene">${Object.keys(SCENES).map(k=>`<button data-k="${k}" class="${k==='dia'?'on':''}">${SCENES[k].n}</button>`).join('')}</div></div>
  <div class="ctl"><div class="lab">ISO (ganancia)<span id="ex-isov">100</span></div>
    <input type="range" id="ex-iso" min="0" max="${ISOS.length-1}" step="1" value="1"></div>
  <div class="ctl"><div class="lab">Velocidad de obturación<span id="ex-shv">1/500</span></div>
    <input type="range" id="ex-sh" min="0" max="${SH.length-1}" step="1" value="2"></div>
  <div class="ctl"><div class="lab">Compensación de exposición<span id="ex-evv">0.0 EV</span></div>
    <input type="range" id="ex-ev" min="-2" max="2" step="0.5" value="0"></div>
  <div class="ctl"><div class="lab">Movimiento del sujeto<span></span></div>
    <div class="seg" id="ex-mot">${Object.keys(MOT).map(k=>`<button data-k="${k}" class="${k==='quieto'?'on':''}">${MOT[k].n}</button>`).join('')}</div></div>
  <div class="chips"><button class="chip on" id="ex-ois">📿 Estabilizador OIS activado</button></div>
  <div class="row" style="margin-bottom:14px">
    <button class="btn ghost sm" id="ex-auto">Volver al valor correcto</button>
  </div>
  <div class="card"><h3 style="margin-top:0">Cómo leerlo</h3>
  <ul class="tiny" style="margin-bottom:0">
    <li><strong>Pasos EV</strong> es cuánto te desviaste de la exposición correcta para esa escena. Cada paso duplica o divide a la mitad la luz.</li>
    <li>Subir el ISO no "agrega luz": <strong>amplifica</strong> la señal que ya capturaste, y amplifica el ruido con ella.</li>
    <li>La velocidad sí cambia cuánta luz entra, pero por debajo de 1/60 tu mano empieza a mover el teléfono, y el sujeto se mueve mucho antes que eso.</li>
    <li>Apagá el OIS y probá 1/8: eso es lo que sacarías con una cámara sin estabilizador.</li>
  </ul></div>`;

  const cv = $('#ex-cv'), ctx = cv.getContext('2d');
  function fit(){
    if(!alive(cv)) return;
    const dpr = Math.min(window.devicePixelRatio||1, 2);
    const w = cv.clientWidth, h = w*3/4;
    cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr);
    draw();
  }
  function calc(){
    const sc = SCENES[st.scene], iso = ISOS[st.iso], t = SH[st.sh][0];
    const stops = Math.log2(iso/sc.iso) + Math.log2(t/sc.t) + st.ev;
    const noise = Math.min(1, Math.pow(iso/100, 0.62)/10);
    const mblur = MOT[st.mot].v * t * 260;
    const lim = st.ois ? 1/15 : 1/60;
    const hblur = t > lim ? Math.min(9, (t/lim - 1) * 2.4 + 0.7) : 0;
    return {sc, iso, t, stops, noise, mblur, hblur};
  }
  function draw(){
    const W = cv.width, H = cv.height, k = W/600;
    if(!W || !H) return;
    const {sc, stops, noise, mblur, hblur} = calc();
    const off = document.createElement('canvas'); off.width = W; off.height = H;
    const o = off.getContext('2d');

    /* cielo */
    const g = o.createLinearGradient(0,0,0,H*0.62);
    g.addColorStop(0, sc.sky[0]); g.addColorStop(1, sc.sky[1]);
    o.fillStyle = g; o.fillRect(0,0,W,H*0.64);
    if(st.scene==='dia'){ o.fillStyle='rgba(255,246,214,.95)'; o.beginPath(); o.arc(W*0.8,H*0.16,26*k,0,7); o.fill(); }
    if(st.scene==='noche'){ o.fillStyle='rgba(255,255,255,.85)';
      for(let i=0;i<70;i++){ o.fillRect(Math.random()*W, Math.random()*H*0.55, 1.6*k, 1.6*k); } }
    /* colinas */
    o.fillStyle = st.scene==='noche' ? '#141b2a' : 'rgba(40,64,48,.75)';
    o.beginPath(); o.moveTo(0,H*0.64);
    o.quadraticCurveTo(W*0.25,H*0.42,W*0.52,H*0.63);
    o.quadraticCurveTo(W*0.78,H*0.48,W,H*0.6); o.lineTo(W,H*0.64); o.closePath(); o.fill();
    /* suelo */
    const g2 = o.createLinearGradient(0,H*0.62,0,H);
    const gc = st.scene==='noche' ? ['#1b2130','#0d1017'] : st.scene==='interior' ? ['#6b5c48','#3d3427'] : ['#6f8d54','#41562f'];
    g2.addColorStop(0,gc[0]); g2.addColorStop(1,gc[1]);
    o.fillStyle = g2; o.fillRect(0,H*0.62,W,H*0.38);
    /* referencia: parche gris medio y carta blanca */
    o.fillStyle = '#7d7d7d'; o.fillRect(W*0.05,H*0.8,W*0.12,H*0.1);
    o.fillStyle = '#f2f2f2'; o.fillRect(W*0.19,H*0.8,W*0.12,H*0.1);

    /* sujeto, con desenfoque de movimiento */
    const n = mblur > 0.6 ? Math.min(26, Math.ceil(mblur)) : 1;
    for(let i=0;i<n;i++){
      const dx = (i - (n-1)/2) * (mblur/Math.max(1,n)) ;
      o.globalAlpha = 1/n;
      subject(o, W*0.52 + dx, H*0.63, k);
    }
    o.globalAlpha = 1;

    /* brillo + ruido, píxel a píxel */
    const f = Math.pow(2, stops);
    const img = o.getImageData(0,0,W,H), d = img.data;
    for(let i=0;i<d.length;i+=4){
      for(let c=0;c<3;c++){
        let v = d[i+c]/255 * f;
        if(v > 1) v = 1;            /* recorte de luces: lo que se quema, se pierde */
        if(noise>0.02){
          const lum = v;
          const amp = noise * (1 - 0.55*lum) * 0.5;
          v += (Math.random()+Math.random()+Math.random()-1.5)/1.5 * amp;
        }
        d[i+c] = Math.max(0, Math.min(255, v*255));
      }
    }
    o.putImageData(img,0,0);

    ctx.clearRect(0,0,W,H);
    ctx.filter = hblur>0 ? 'blur(' + (hblur*k).toFixed(2) + 'px)' : 'none';
    ctx.drawImage(off,0,0);
    ctx.filter = 'none';

    /* lecturas */
    const noiseLbl = noise<0.06?'Bajo':noise<0.13?'Visible':noise<0.22?'Alto':'Muy alto';
    const blurTot = mblur + hblur*2;
    const blurLbl = blurTot<1.5?'Nítido':blurTot<5?'Leve':blurTot<14?'Notorio':'Arruinado';
    $('#ex-st').textContent = (stops>0?'+':'') + stops.toFixed(1);
    $('#ex-no').textContent = noiseLbl;
    $('#ex-bl').textContent = blurLbl;
    const vd = $('#ex-vd');
    let cls='ok', msg='';
    if(Math.abs(stops) > 2.4){ cls='bad'; msg = stops>0 ? 'Sobreexpuesta: las luces se quemaron y esa información no se recupera ni en RAW.' : 'Subexpuesta: al aclararla en edición vas a levantar todo el ruido de las sombras.'; }
    else if(Math.abs(stops) > 1.1){ cls='warn'; msg = stops>0 ? 'Bastante clara. En RAW se rescata; en JPEG ya perdés detalle en las luces.' : 'Bastante oscura. Recuperable, pero con costo de ruido.'; }
    else if(blurTot > 14){ cls='bad'; msg = 'Exposición razonable, pero la foto está movida. La nitidez no se arregla después.'; }
    else if(noise > 0.22){ cls='warn'; msg = 'Exposición razonable, pero el ISO está muy alto y se come la textura fina.'; }
    else if(blurTot > 5){ cls='warn'; msg = 'Casi. Hay algo de movimiento: subí la velocidad y compensá con ISO.'; }
    else { cls='ok'; msg = 'Buena combinación: exposición correcta, nítida y con ruido controlado.'; }
    vd.className = 'verdict ' + cls; vd.textContent = msg;
    $('#ex-isov').textContent = ISOS[st.iso];
    $('#ex-shv').textContent = SH[st.sh][1];
    $('#ex-evv').textContent = (st.ev>0?'+':'') + st.ev.toFixed(1) + ' EV';
    $('#ex-scn').textContent = 'correcta: ISO ' + sc.iso + ' · ' + SH.find(s=>Math.abs(s[0]-sc.t)<1e-9)[1];
  }
  function subject(o,x,y,k){
    o.fillStyle = '#20252c';
    o.beginPath(); o.arc(x, y-46*k, 11*k, 0, 7); o.fill();               /* cabeza */
    o.beginPath(); o.moveTo(x-13*k,y); o.lineTo(x-7*k,y-34*k);
    o.lineTo(x+7*k,y-34*k); o.lineTo(x+13*k,y); o.closePath(); o.fill(); /* cuerpo */
  }

  $$('#ex-scene button').forEach(b=> b.onclick = ()=>{
    st.scene = b.dataset.k; $$('#ex-scene button').forEach(x=>x.classList.toggle('on',x===b));
    const sc = SCENES[st.scene];
    st.iso = ISOS.indexOf(sc.iso); st.sh = SH.findIndex(s=>Math.abs(s[0]-sc.t)<1e-9); st.ev = 0;
    $('#ex-iso').value = st.iso; $('#ex-sh').value = st.sh; $('#ex-ev').value = 0;
    draw();
  });
  $$('#ex-mot button').forEach(b=> b.onclick = ()=>{
    st.mot = b.dataset.k; $$('#ex-mot button').forEach(x=>x.classList.toggle('on',x===b)); draw();
  });
  $('#ex-iso').oninput = e=>{ st.iso = +e.target.value; draw(); };
  $('#ex-sh').oninput  = e=>{ st.sh  = +e.target.value; draw(); };
  $('#ex-ev').oninput  = e=>{ st.ev  = +e.target.value; draw(); };
  $('#ex-ois').onclick = e=>{ st.ois = !st.ois; e.target.classList.toggle('on', st.ois);
    e.target.textContent = st.ois ? '📿 Estabilizador OIS activado' : '📿 Estabilizador OIS apagado'; draw(); };
  $('#ex-auto').onclick = ()=>{
    const sc = SCENES[st.scene];
    st.iso = ISOS.indexOf(sc.iso); st.sh = SH.findIndex(s=>Math.abs(s[0]-sc.t)<1e-9); st.ev = 0;
    $('#ex-iso').value = st.iso; $('#ex-sh').value = st.sh; $('#ex-ev').value = 0; draw();
  };
  onResize(fit);
  fit();
}

/* ------------------------------------------------------------
   HERRAMIENTA 2 · Rueda de color
   ------------------------------------------------------------ */
function toolColor(root){
  const HARM = {
    comp:   {n:'Complementarios', off:[0,180],          d:'Máximo contraste. Es el azul y naranja de los atardeceres, y el verde y magenta de una flor en el pasto.'},
    anal:   {n:'Análogos',        off:[0,-30,30],       d:'Vecinos en la rueda. Da armonía y calma: la paleta natural de un bosque o de una hora azul.'},
    tri:    {n:'Triádicos',       off:[0,120,240],      d:'Tres colores equidistantes. Vibrante pero equilibrado. Difícil de encontrar en la naturaleza, común en arquitectura.'},
    split:  {n:'Compl. dividido', off:[0,150,210],      d:'Como complementarios pero más suave. Muy útil en retrato: piel cálida contra dos fríos.'}
  };
  let hue = 28, harm = 'comp';

  root.innerHTML = `
  <p class="tiny">El color no se agrega al editar: se <strong>busca</strong> al encuadrar. Elegí un color de la rueda y mirá con qué otros se relaciona bien.</p>
  <canvas class="cv" id="cw" style="aspect-ratio:1/1;background:transparent;border:0"></canvas>
  <div class="seg" id="c-harm">${Object.keys(HARM).map(k=>`<button data-k="${k}" class="${k==='comp'?'on':''}">${HARM[k].n}</button>`).join('')}</div>
  <div class="ctl"><div class="lab">Tono base<span id="c-hv">28°</span></div>
    <input type="range" id="c-hue" min="0" max="359" value="28"></div>
  <div class="sw" id="c-sw"></div>
  <div class="verdict" id="c-d"></div>
  <canvas class="cv" id="c-prev" style="aspect-ratio:16/9"></canvas>
  <p class="tiny">Arriba, una escena simulada con la paleta aplicada: fondo, sujeto y acento.</p>
  <div class="card"><h3 style="margin-top:0">Dónde encontrar estas armonías en la vida real</h3>
  <div class="tw"><table><thead><tr><th>Armonía</th><th>Dónde aparece</th></tr></thead><tbody>
  <tr><td><strong>Complementarios</strong></td><td>Atardecer: cielo naranja y sombras azules. Un techo de tejas contra el cielo.</td></tr>
  <tr><td><strong>Análogos</strong></td><td>Bosque en otoño, hora azul, un campo de trigo. La paleta más fácil de conseguir.</td></tr>
  <tr><td><strong>Triádicos</strong></td><td>Ferias, mercados, puertas pintadas, ropa de chicos.</td></tr>
  <tr><td><strong>Compl. dividido</strong></td><td>Retrato: piel cálida con fondo verde y azul. La receta más segura para retratar a tu familia al aire libre.</td></tr>
  </tbody></table></div></div>`;

  const cw = $('#cw'), cx = cw.getContext('2d');
  const pv = $('#c-prev'), px = pv.getContext('2d');

  function hsl(h,s,l){ return 'hsl(' + ((h%360)+360)%360 + ' ' + s + '% ' + l + '%)'; }
  function hex(h,s,l){
    s/=100; l/=100;
    const a = s*Math.min(l,1-l);
    const f = n=>{ const k=(n+h/30)%12; const c=l-a*Math.max(-1,Math.min(k-3,Math.min(9-k,1)));
      return Math.round(255*c).toString(16).padStart(2,'0'); };
    return '#'+f(0)+f(8)+f(4);
  }
  function fit(){
    if(!alive(cw)) return;
    const dpr = Math.min(window.devicePixelRatio||1,2);
    const w = cw.clientWidth;
    cw.width = cw.height = Math.round(w*dpr);
    pv.width = Math.round(pv.clientWidth*dpr); pv.height = Math.round(pv.clientWidth*9/16*dpr);
    draw();
  }
  function draw(){
    const W = cw.width, R = W/2;
    if(!W) return;
    const cxp = R, cyp = R, ro = R*0.93, ri = R*0.58;
    cx.clearRect(0,0,W,W);
    for(let a=0;a<360;a++){
      const s = (a-90.6)*Math.PI/180, e = (a-89)*Math.PI/180;
      const grd = cx.createRadialGradient(cxp,cyp,ri,cxp,cyp,ro);
      grd.addColorStop(0, hsl(a,38,62)); grd.addColorStop(1, hsl(a,88,52));
      cx.beginPath(); cx.arc(cxp,cyp,ro,s,e); cx.arc(cxp,cyp,ri,e,s,true); cx.closePath();
      cx.fillStyle = grd; cx.fill();
    }
    const offs = HARM[harm].off;
    offs.forEach((o,i)=>{
      const a = (hue+o-90)*Math.PI/180;
      const r = (ro+ri)/2;
      const x = cxp+Math.cos(a)*r, y = cyp+Math.sin(a)*r;
      cx.beginPath(); cx.arc(x,y,R*0.085,0,7);
      cx.fillStyle = hex(hue+o,85,52); cx.fill();
      cx.lineWidth = R*0.022; cx.strokeStyle = i===0 ? '#fff' : 'rgba(255,255,255,.75)'; cx.stroke();
      cx.beginPath(); cx.moveTo(cxp,cyp); cx.lineTo(x,y);
      cx.strokeStyle = 'rgba(255,255,255,.22)'; cx.lineWidth = R*0.008; cx.stroke();
    });
    /* centro */
    cx.beginPath(); cx.arc(cxp,cyp,ri*0.92,0,7);
    cx.fillStyle = hex(hue,85,52); cx.fill();
    cx.font = (R*0.13)+'px ui-monospace,Menlo,monospace'; cx.textAlign='center'; cx.textBaseline='middle';
    cx.fillStyle = '#00000099'; cx.fillText(hex(hue,85,52).toUpperCase(), cxp, cyp);

    $('#c-sw').innerHTML = offs.map((o,i)=>{
      const c = hex(hue+o,85,52);
      return `<div class="s"><div class="c" style="background:${c}"></div>
        <div class="n">${c.toUpperCase()}<br>${Math.round(((hue+o)%360+360)%360)}°</div></div>`;
    }).join('');
    $('#c-d').textContent = HARM[harm].d;
    $('#c-hv').textContent = hue + '°';
    prev(offs);
  }
  function prev(offs){
    const W = pv.width, H = pv.height;
    const bg = hex(hue+offs[offs.length-1],55,30);
    const g = px.createLinearGradient(0,0,0,H);
    g.addColorStop(0, hex(hue+offs[offs.length-1],62,42));
    g.addColorStop(1, bg);
    px.fillStyle = g; px.fillRect(0,0,W,H);
    px.fillStyle = hex(hue+(offs[1]||0),50,22); px.fillRect(0,H*0.68,W,H*0.32);
    px.fillStyle = hex(hue,88,54);
    px.beginPath(); px.arc(W*0.33,H*0.52,H*0.1,0,7); px.fill();
    px.fillRect(W*0.29,H*0.6,W*0.08,H*0.16);
    px.fillStyle = hex(hue+(offs[2]||offs[1]||180),90,58);
    px.fillRect(W*0.68,H*0.4,W*0.05,H*0.28);
    px.fillStyle = 'rgba(255,255,255,.5)';
    px.font = (H*0.075)+'px ' + getComputedStyle(document.body).fontFamily;
    px.textAlign = 'left'; px.textBaseline='top';
    px.fillText('escena simulada', W*0.03, H*0.05);
  }
  $('#c-hue').oninput = e=>{ hue = +e.target.value; draw(); };
  $$('#c-harm button').forEach(b=> b.onclick = ()=>{
    harm = b.dataset.k; $$('#c-harm button').forEach(x=>x.classList.toggle('on',x===b)); draw(); });
  function pick(ev){
    const r = cw.getBoundingClientRect();
    const t = ev.touches ? ev.touches[0] : ev;
    const x = t.clientX - r.left - r.width/2, y = t.clientY - r.top - r.height/2;
    if(Math.hypot(x,y) < r.width*0.26) return;
    hue = Math.round((Math.atan2(y,x)*180/Math.PI + 90 + 360) % 360);
    $('#c-hue').value = hue; draw();
  }
  cw.addEventListener('click', pick);
  cw.addEventListener('touchmove', e=>{ e.preventDefault(); pick(e); }, {passive:false});
  onResize(fit);
  fit();
}

/* ------------------------------------------------------------
   HERRAMIENTA 3 · Balance de blancos
   ------------------------------------------------------------ */
function toolWB(root){
  const PRE = [[1900,'Vela'],[2700,'Lámpara cálida'],[3400,'Tungsteno'],[4200,'Fluorescente'],
               [5500,'Luz de día'],[6500,'Nublado'],[7800,'Sombra'],[9500,'Hora azul']];
  let lightK = 5500, camK = 5500;

  root.innerHTML = `
  <p class="tiny">El balance de blancos no cambia la luz: le dice a la cámara <strong>de qué color suponer que es la luz</strong>. Si le mentís, todo se tiñe. Mové los dos controles y mirá qué pasa.</p>
  <canvas class="cv" id="wb-cv" style="aspect-ratio:4/3"></canvas>
  <div class="readout">
    <div><b id="wb-l">5500K</b><span>Luz real</span></div>
    <div><b id="wb-c">5500K</b><span>Cámara</span></div>
    <div><b id="wb-d">0</b><span>Diferencia</span></div>
  </div>
  <div class="verdict" id="wb-vd"></div>
  <div class="ctl"><div class="lab">🔆 Temperatura de la luz real<span id="wb-lv">5500 K</span></div>
    <input type="range" id="wb-lk" min="1800" max="10000" step="100" value="5500">
    <div class="chips" style="margin-top:9px" id="wb-pre">${PRE.map(p=>`<button class="chip" data-k="${p[0]}">${p[1]}</button>`).join('')}</div></div>
  <div class="ctl"><div class="lab">📷 Balance de blancos de la cámara<span id="wb-cv2">5500 K</span></div>
    <input type="range" id="wb-ck" min="1800" max="10000" step="100" value="5500"></div>
  <div class="row" style="margin-bottom:14px">
    <button class="btn ghost sm" id="wb-match">Igualar cámara a la luz</button>
    <button class="btn ghost sm" id="wb-auto">Simular automático</button>
  </div>
  <div class="card"><h3 style="margin-top:0">La regla que cuesta recordar</h3>
  <div class="tw"><table><thead><tr><th>Si la cámara está en...</th><th>La foto sale...</th></tr></thead><tbody>
  <tr><td><strong>Más Kelvin que la luz</strong></td><td>Más <strong>cálida</strong>, anaranjada</td></tr>
  <tr><td><strong>Menos Kelvin que la luz</strong></td><td>Más <strong>fría</strong>, azulada</td></tr>
  <tr><td><strong>Igual que la luz</strong></td><td>Neutra: el blanco sale blanco</td></tr>
  </tbody></table></div>
  <p class="tiny" style="margin-bottom:0">Parece al revés, y por eso se olvida. El número que ponés en la cámara describe la luz que <em>asumís</em>; si asumís luz más cálida de la real, la cámara compensa de menos y el resultado queda cálido.</p>
  </div>`;

  const cv = $('#wb-cv'), ctx = cv.getContext('2d');
  function k2rgb(k){
    const t = k/100; let r,g,b;
    if(t<=66){ r=255; g=99.47*Math.log(t)-161.12; }
    else { r=329.7*Math.pow(t-60,-0.1332); g=288.12*Math.pow(t-60,-0.0755); }
    if(t>=66) b=255; else if(t<=19) b=0; else b=138.52*Math.log(t-10)-305.04;
    const c = v=>Math.max(0,Math.min(255,v));
    return [c(r),c(g),c(b)];
  }
  function fit(){
    if(!alive(cv)) return;
    const dpr = Math.min(window.devicePixelRatio||1,2);
    const w = cv.clientWidth; cv.width = Math.round(w*dpr); cv.height = Math.round(w*3/4*dpr);
    draw();
  }
  function draw(){
    const W = cv.width, H = cv.height;
    if(!W || !H) return;
    const off = document.createElement('canvas'); off.width=W; off.height=H;
    const o = off.getContext('2d');
    /* escena neutra: pared, carta de grises, piel, camisa blanca, planta */
    o.fillStyle = '#9aa0a6'; o.fillRect(0,0,W,H);
    o.fillStyle = '#b8bcc0'; o.fillRect(0,0,W,H*0.55);
    o.fillStyle = '#7a8087'; o.fillRect(0,H*0.55,W,H*0.02);
    /* carta de grises */
    const gs = ['#ffffff','#c8c8c8','#7d7d7d','#3c3c3c','#111111'];
    gs.forEach((c,i)=>{ o.fillStyle=c; o.fillRect(W*(0.06+i*0.075), H*0.68, W*0.07, H*0.2); });
    /* persona: camisa blanca (referencia de blanco) + piel (referencia de tono cálido) */
    o.fillStyle = '#ecedef'; o.beginPath(); o.moveTo(W*0.585,H*0.55);
    o.lineTo(W*0.648,H*0.40); o.lineTo(W*0.798,H*0.40); o.lineTo(W*0.861,H*0.55); o.closePath(); o.fill();
    o.fillStyle = '#b8825f'; o.fillRect(W*0.699,H*0.355,W*0.048,H*0.055);              /* cuello */
    o.fillStyle = '#3a2b22'; o.beginPath(); o.ellipse(W*0.723,H*0.268,W*0.078,H*0.112,0,0,7); o.fill(); /* pelo */
    o.fillStyle = '#c99574'; o.beginPath(); o.ellipse(W*0.723,H*0.292,W*0.066,H*0.094,0,0,7); o.fill(); /* rostro */
    /* planta */
    o.fillStyle = '#4c7a45';
    for(let i=0;i<5;i++){ o.beginPath(); o.ellipse(W*0.22,H*0.33, W*0.055, H*0.018, i*0.63, 0, 7); o.fill(); }
    o.fillStyle = '#6b4a34'; o.fillRect(W*0.20,H*0.36,W*0.04,H*0.18);

    /* aplicar luz y balance */
    const L = k2rgb(lightK), C = k2rgb(camK);
    const Ln = L.map(v=>v/L[1]), Cn = C.map(v=>v/C[1]);
    const gain = [Ln[0]/Cn[0], 1, Ln[2]/Cn[2]];
    const img = o.getImageData(0,0,W,H), d = img.data;
    for(let i=0;i<d.length;i+=4){
      for(let c=0;c<3;c++){ d[i+c] = Math.max(0,Math.min(255, d[i+c]*gain[c])); }
    }
    o.putImageData(img,0,0);
    ctx.clearRect(0,0,W,H); ctx.drawImage(off,0,0);
    /* etiquetas */
    ctx.fillStyle='rgba(0,0,0,.45)'; ctx.fillRect(0,0,W,H*0.09);
    ctx.fillStyle='#fff'; ctx.textAlign='left'; ctx.textBaseline='middle';
    ctx.font = (H*0.05)+'px ui-monospace,Menlo,monospace';
    ctx.fillText('luz ' + lightK + 'K  ·  cámara ' + camK + 'K', W*0.02, H*0.045);

    const dk = camK - lightK;
    $('#wb-l').textContent = lightK + 'K'; $('#wb-c').textContent = camK + 'K';
    $('#wb-d').textContent = (dk>0?'+':'') + dk;
    $('#wb-lv').textContent = lightK + ' K'; $('#wb-cv2').textContent = camK + ' K';
    const vd = $('#wb-vd');
    if(Math.abs(dk) < 250){ vd.className='verdict ok'; vd.textContent = 'Balance correcto: el blanco sale blanco y la piel sale con su color real.'; }
    else if(dk > 0){ vd.className='verdict warn'; vd.textContent = 'Imagen cálida, corrida al naranja. A veces es un error; otras veces es exactamente lo que querés en un atardecer.'; }
    else { vd.className='verdict warn'; vd.textContent = 'Imagen fría, corrida al azul. Útil para transmitir noche o frío, malo para la piel.'; }
    if(Math.abs(dk) > 2800){ vd.className='verdict bad';
      vd.textContent = 'Desvío muy grande: el color ya no es corregible sin dañar la piel. Acá es donde el RAW te salva.'; }
  }
  $('#wb-lk').oninput = e=>{ lightK = +e.target.value; draw(); };
  $('#wb-ck').oninput = e=>{ camK = +e.target.value; draw(); };
  $$('#wb-pre button').forEach(b=> b.onclick = ()=>{
    lightK = +b.dataset.k; $('#wb-lk').value = lightK;
    $$('#wb-pre button').forEach(x=>x.classList.toggle('on',x===b)); draw(); });
  $('#wb-match').onclick = ()=>{ camK = lightK; $('#wb-ck').value = camK; draw(); toast('Cámara igualada a la luz'); };
  $('#wb-auto').onclick = ()=>{
    /* el automático acierta pero tiende a neutralizar de más, sobre todo en luz muy cálida */
    camK = Math.round(lightK - (lightK-5200)*0.28);
    $('#wb-ck').value = camK; draw();
    toast('Así suele resolver el automático: neutraliza de más');
  };
  onResize(fit);
  fit();
}

/* ------------------------------------------------------------
   HERRAMIENTA 4 · Cuadrículas de composición
   ------------------------------------------------------------ */
function toolGrids(root){
  let img = null, rot = 0;
  const G = {tercios:true, aurea:false, diag:false, centro:false, v916:false};
  const NAMES = {tercios:'Tercios', aurea:'Prop. áurea', diag:'Diagonales', centro:'Centro', v916:'Recorte 9:16'};

  root.innerHTML = `
  <p class="tiny">Cargá una foto tuya y verificá la composición: si el sujeto cae en un cruce, si el horizonte está derecho, y cómo quedaría recortada para historias.</p>
  <label class="filein" for="g-file">📷 Toca para elegir una foto de tu galería<br><span class="tiny">No se sube a ningún lado: se procesa en tu teléfono.</span></label>
  <input type="file" id="g-file" accept="image/*" style="display:none">
  <canvas class="cv" id="g-cv" style="aspect-ratio:4/3"></canvas>
  <div class="chips" style="margin-top:12px" id="g-chips">
    ${Object.keys(G).map(k=>`<button class="chip ${G[k]?'on':''}" data-k="${k}">${NAMES[k]}</button>`).join('')}
  </div>
  <div class="ctl"><div class="lab">Rotación, para enderezar el horizonte<span id="g-rv">0.0°</span></div>
    <input type="range" id="g-rot" min="-6" max="6" step="0.2" value="0"></div>
  <div class="row" style="margin-bottom:14px">
    <button class="btn ghost sm" id="g-reset">Reiniciar</button>
  </div>
  <div class="card"><h3 style="margin-top:0">Qué chequear</h3>
  <ul class="tiny" style="margin-bottom:0">
    <li><strong>Tercios:</strong> ¿el sujeto cae sobre una línea o un cruce, o quedó en el centro por inercia?</li>
    <li><strong>Proporción áurea:</strong> una variante más apretada de los tercios. Si tu foto funciona mejor con esta, tu sujeto quiere estar más cerca del borde.</li>
    <li><strong>Diagonales:</strong> ¿hay líneas de la escena que coincidan con las diagonales del cuadro? Si sí, la foto tiene estructura.</li>
    <li><strong>Rotación:</strong> movela hasta que el horizonte quede derecho. Lo que marque el control es cuánto estaba torcido.</li>
    <li><strong>Recorte 9:16:</strong> lo que queda dentro del rectángulo es lo que va a ver alguien en una historia.</li>
  </ul></div>`;

  const cv = $('#g-cv'), ctx = cv.getContext('2d');
  function fit(){
    if(!alive(cv)) return;
    const dpr = Math.min(window.devicePixelRatio||1,2);
    const w = cv.clientWidth;
    const ar = img ? img.height/img.width : 3/4;
    cv.width = Math.round(w*dpr); cv.height = Math.round(w*ar*dpr);
    cv.style.aspectRatio = img ? (img.width+'/'+img.height) : '4/3';
    draw();
  }
  function demo(o,W,H){
    const g = o.createLinearGradient(0,0,0,H*0.6);
    g.addColorStop(0,'#2b6bb5'); g.addColorStop(1,'#e8b46a');
    o.fillStyle=g; o.fillRect(0,0,W,H*0.62);
    o.fillStyle='#fff3cf'; o.beginPath(); o.arc(W*0.7,H*0.45,H*0.07,0,7); o.fill();
    o.fillStyle='#2f4536'; o.beginPath(); o.moveTo(0,H*0.62);
    o.quadraticCurveTo(W*0.3,H*0.45,W*0.6,H*0.62); o.lineTo(W,H*0.55); o.lineTo(W,H*0.62); o.closePath(); o.fill();
    o.fillStyle='#1d2a20'; o.fillRect(0,H*0.62,W,H*0.38);
    o.fillStyle='#0f1712'; o.beginPath(); o.moveTo(W*0.3,H); o.lineTo(W*0.46,H*0.63);
    o.lineTo(W*0.54,H*0.63); o.lineTo(W*0.8,H); o.closePath(); o.fill();
    o.fillStyle='#e9edf2'; o.font=(H*0.045)+'px '+getComputedStyle(document.body).fontFamily;
    o.textAlign='center'; o.fillText('escena de ejemplo — cargá tu foto', W/2, H*0.94);
  }
  function draw(){
    const W = cv.width, H = cv.height;
    if(!W || !H) return;
    ctx.clearRect(0,0,W,H);
    ctx.save();
    ctx.translate(W/2,H/2);
    const rad = rot*Math.PI/180;
    const sc = Math.abs(Math.cos(rad)) + Math.abs(Math.sin(rad))*(H/W > 1 ? H/W : W/H);
    ctx.scale(sc,sc); ctx.rotate(rad); ctx.translate(-W/2,-H/2);
    if(img) ctx.drawImage(img,0,0,W,H); else demo(ctx,W,H);
    ctx.restore();

    const lw = Math.max(1, W/560);
    ctx.lineWidth = lw;
    const line=(x1,y1,x2,y2,col)=>{ ctx.strokeStyle=col; ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); };
    const halo='rgba(0,0,0,.35)', main='rgba(255,255,255,.72)';
    if(G.tercios){
      [1/3,2/3].forEach(f=>{
        ctx.lineWidth=lw*2.4; line(0,H*f,W,H*f,halo); line(W*f,0,W*f,H,halo);
        ctx.lineWidth=lw;      line(0,H*f,W,H*f,main); line(W*f,0,W*f,H,main);
      });
      [[1/3,1/3],[2/3,1/3],[1/3,2/3],[2/3,2/3]].forEach(p=>{
        ctx.beginPath(); ctx.arc(W*p[0],H*p[1],lw*4,0,7);
        ctx.fillStyle='rgba(240,167,42,.95)'; ctx.fill();
      });
    }
    if(G.aurea){
      const phi=0.382;
      [phi,1-phi].forEach(f=>{
        ctx.setLineDash([lw*6,lw*5]);
        ctx.lineWidth=lw*2.2; line(0,H*f,W,H*f,halo); line(W*f,0,W*f,H,halo);
        ctx.lineWidth=lw;     line(0,H*f,W,H*f,'rgba(56,178,166,.9)'); line(W*f,0,W*f,H,'rgba(56,178,166,.9)');
        ctx.setLineDash([]);
      });
    }
    if(G.diag){
      ctx.lineWidth=lw*2.2; line(0,0,W,H,halo); line(W,0,0,H,halo);
      ctx.lineWidth=lw;     line(0,0,W,H,'rgba(255,255,255,.55)'); line(W,0,0,H,'rgba(255,255,255,.55)');
    }
    if(G.centro){
      ctx.lineWidth=lw*2.2; line(W/2,0,W/2,H,halo); line(0,H/2,W,H/2,halo);
      ctx.lineWidth=lw;     line(W/2,0,W/2,H,'rgba(239,93,107,.8)'); line(0,H/2,W,H/2,'rgba(239,93,107,.8)');
    }
    if(G.v916){
      const cw2 = Math.min(W, H*9/16), ch = Math.min(H, W*16/9);
      const x = (W-cw2)/2, y = (H-ch)/2;
      ctx.fillStyle='rgba(0,0,0,.45)';
      ctx.fillRect(0,0,x,H); ctx.fillRect(x+cw2,0,W-x-cw2,H);
      ctx.fillRect(x,0,cw2,y); ctx.fillRect(x,y+ch,cw2,H-y-ch);
      ctx.lineWidth=lw*1.6; ctx.strokeStyle='rgba(240,167,42,.95)'; ctx.strokeRect(x,y,cw2,ch);
    }
    $('#g-rv').textContent = (rot>0?'+':'') + rot.toFixed(1) + '°';
  }
  $('#g-file').onchange = e=>{
    const f = e.target.files && e.target.files[0]; if(!f) return;
    const url = URL.createObjectURL(f);
    const i = new Image();
    i.onload = ()=>{ img = i; fit(); toast('Foto cargada'); URL.revokeObjectURL(url); };
    i.onerror = ()=> toast('No pude abrir esa imagen');
    i.src = url;
  };
  $$('#g-chips button').forEach(b=> b.onclick = ()=>{
    G[b.dataset.k] = !G[b.dataset.k]; b.classList.toggle('on', G[b.dataset.k]); draw(); });
  $('#g-rot').oninput = e=>{ rot = +e.target.value; draw(); };
  $('#g-reset').onclick = ()=>{ rot=0; $('#g-rot').value=0; img=null; fit(); };
  onResize(fit);
  fit();
}

/* ------------------------------------------------------------
   HERRAMIENTA 5 · Checklist antes de disparar
   ------------------------------------------------------------ */
function toolCheck(root){
  let tab = 'paisaje';
  S.tools.check = S.tools.check || {paisaje:[], retrato:[]};

  function render(){
    const list = CHECKS[tab], st = S.tools.check[tab] || [];
    const n = list.filter((_,i)=>st[i]).length;
    root.innerHTML = `
    <p class="tiny">Un repaso de 20 segundos antes de apretar el botón. Con el tiempo se vuelve automático y ya no lo vas a necesitar.</p>
    <div class="seg" id="k-tab">
      <button data-k="paisaje" class="${tab==='paisaje'?'on':''}">🏞️ Paisaje</button>
      <button data-k="retrato" class="${tab==='retrato'?'on':''}">👤 Retrato</button>
    </div>
    <div class="card">
      <div class="lab" style="display:flex;justify-content:space-between;font-size:13px;font-weight:640;margin-bottom:9px">
        <span>${n} de ${list.length} revisados</span><span style="color:var(--accent)">${Math.round(n/list.length*100)}%</span></div>
      <div class="bar"><i style="width:${n/list.length*100}%"></i></div>
    </div>
    <div class="card">
      ${list.map((c,i)=>`<div class="ck">
        <input type="checkbox" id="k${i}" data-i="${i}" ${st[i]?'checked':''}>
        <label for="k${i}">${c}</label></div>`).join('')}
    </div>
    <button class="btn ghost" id="k-reset">Reiniciar checklist</button>`;
    $$('#k-tab button').forEach(b=> b.onclick = ()=>{ tab = b.dataset.k; render(); });
    $$('#v-tool .ck input').forEach(inp=> inp.onchange = ()=>{
      const a = S.tools.check[tab] || []; a[+inp.dataset.i] = inp.checked;
      S.tools.check[tab] = a; save(); render();
    });
    $('#k-reset').onclick = ()=>{ S.tools.check[tab] = []; save(); render(); toast('Checklist reiniciado'); };
  }
  render();
}

/* ============================================================
   PANTALLA: ESTADO DEL CURSO
   ============================================================ */
function renderEstado(){
  const d = doneCount(), pct = Math.round(d/LESSONS.length*100);
  const graded = LESSONS.filter(l=>S.grades[l.n] && S.grades[l.n].nota);
  const avg = graded.length ? (graded.reduce((a,l)=>a+S.grades[l.n].nota,0)/graded.length) : null;

  let h = `<div class="hero">
    <div class="k">Estado del curso</div>
    <div class="big">${pct}% completado</div>
    <div class="stats">
      <div class="stat"><b>${d}/${LESSONS.length}</b><span>Lecciones</span></div>
      <div class="stat"><b>${avg!==null?avg.toFixed(1):'—'}</b><span>Promedio</span></div>
      <div class="stat"><b>${graded.length}</b><span>Evaluadas</span></div>
    </div>
    <div class="bar" style="margin-top:13px"><i style="width:${pct}%"></i></div>
  </div>`;

  if(avg !== null && avg < 7){
    h += `<div class="note warn"><p>Tu promedio está por debajo de 7. Según lo que acordamos, te voy a proponer repetir alguna tarea antes de avanzar, pero la decisión final de seguir es tuya.</p></div>`;
  }

  h += `<h3>Detalle por lección</h3><div class="tw"><table>
    <thead><tr><th>#</th><th>Lección</th><th>Estado</th><th>Nota</th></tr></thead><tbody>`;
  LESSONS.forEach(l=>{
    const g = S.grades[l.n];
    h += `<tr><td>${l.n}</td><td>${esc(l.title)}</td>
      <td>${S.done[l.n]?'<span style="color:var(--ok)">✓ hecha</span>':(l.ready?'<span class="muted">pendiente</span>':'<span class="muted">por dictar</span>')}</td>
      <td>${g&&g.nota?g.nota:'—'}</td></tr>`;
  });
  h += `</tbody></table></div>`;

  const refuerzo = LESSONS.filter(l=>S.grades[l.n] && S.grades[l.n].notas).map(l=>({n:l.n,t:l.title,x:S.grades[l.n].notas}));
  if(refuerzo.length){
    h += `<h3>Puntos a reforzar</h3>`;
    refuerzo.forEach(r=>{ h += `<div class="card"><b style="font-size:14px">Lección ${r.n} · ${esc(r.t)}</b>
      <p class="tiny" style="margin:6px 0 0">${esc(r.x)}</p></div>`; });
  }

  h += `<h3>Retomar en otra conversación</h3>
  <p class="tiny">Este texto resume tu avance. Copialo y pegámelo al empezar un chat nuevo: con eso retomo el curso justo donde lo dejaste, sin que tengas que explicarme nada.</p>
  <textarea id="es-tx" rows="9" readonly>${esc(resumen())}</textarea>
  <div class="row" style="margin:10px 0 22px">
    <button class="btn" id="es-copy">Copiar resumen</button>
  </div>
  <h3>Datos</h3>
  <div class="card">
    <p class="tiny">Tu progreso se guarda sólo en este teléfono, en el almacenamiento del navegador. Si borrás los datos del sitio o desinstalás la app, se pierde. Copiá el resumen de arriba de vez en cuando como respaldo.</p>
    <button class="btn ghost sm" id="es-wipe" style="width:100%">Borrar todo mi progreso</button>
  </div>`;

  $('#v-estado').innerHTML = h;
  $('#es-copy').onclick = async ()=>{
    const tx = resumen();
    try{ await navigator.clipboard.writeText(tx); toast('Resumen copiado'); }
    catch(e){ const t = $('#es-tx'); t.removeAttribute('readonly'); t.select(); t.setSelectionRange(0,99999);
      try{ document.execCommand('copy'); toast('Resumen copiado'); }catch(e2){ toast('Seleccionalo y copialo a mano'); }
      t.setAttribute('readonly','readonly'); }
  };
  $('#es-wipe').onclick = ()=>{
    if(confirm('¿Borrar todo tu progreso, notas y checklists? No se puede deshacer.')){
      S = JSON.parse(JSON.stringify(DEF)); save(); applyTheme(); toast('Progreso borrado'); renderEstado();
    }
  };
}
function resumen(){
  const d = doneCount();
  const graded = LESSONS.filter(l=>S.grades[l.n] && S.grades[l.n].nota);
  const avg = graded.length ? (graded.reduce((a,l)=>a+S.grades[l.n].nota,0)/graded.length).toFixed(1) : 'sin notas';
  let t = 'ESTADO DEL CURSO DE FOTOGRAFIA (app Enfoque)\n';
  t += 'Telefono: Samsung Galaxy S25+ (256 GB), One UI 8.5, sistema en ingles.\n';
  t += 'Ritmo: unas 2 h por semana, sin fecha limite. Sin tripode ni accesorios.\n';
  t += 'Uso: viajes en familia y redes sociales. Sujetos: esposa, hija y un gato.\n';
  t += 'Edicion: solo opciones gratuitas. Tengo computadora personal disponible.\n\n';
  t += 'Lecciones completadas: ' + d + ' de ' + LESSONS.length + '. Promedio: ' + avg + '\n\n';
  const done = LESSONS.filter(l=>S.done[l.n]);
  if(done.length){
    t += 'HECHAS:\n';
    done.forEach(l=>{ const g=S.grades[l.n];
      t += '- L' + l.n + ' ' + l.title + (g&&g.nota?(' (nota '+g.nota+')'):'') + '\n'; });
    t += '\n';
  }
  const nx = nextLesson();
  if(nx) t += 'SIGUIENTE: Leccion ' + nx.n + ' - ' + nx.title + '\n\n';
  const ref = LESSONS.filter(l=>S.grades[l.n] && S.grades[l.n].notas);
  if(ref.length){
    t += 'A REFORZAR:\n';
    ref.forEach(l=>{ t += '- L' + l.n + ': ' + S.grades[l.n].notas + '\n'; });
  }
  return t;
}

/* ---------- arranque ---------- */
renderCurso();
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
