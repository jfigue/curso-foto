<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Enfoque</title>
<meta name="description" content="Curso de fotografía para Galaxy S25+, de cero a experto.">
<meta name="theme-color" content="#0d0f12">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0d0f12; --surface:#15191e; --elev:#1d232a; --elev2:#252d36;
  --border:#2b333d; --border-soft:#222931;
  --text:#e9edf2; --muted:#98a3b0; --faint:#6b7684;
  --accent:#f0a72a; --accent-ink:#1a1204;
  --teal:#38b2a6;
  --n1:#4ec97e; --n2:#4aa8f0; --n3:#f0873f; --n4:#ef5d6b;
  --ok:#4ec97e; --warn:#f0a72a; --bad:#ef5d6b;
  --r:14px; --rs:10px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
:root[data-theme="light"]{
  --bg:#f6f7f9; --surface:#ffffff; --elev:#ffffff; --elev2:#eef1f5;
  --border:#d8dee6; --border-soft:#e6eaf0;
  --text:#14181d; --muted:#5b6672; --faint:#8a95a2;
  --accent:#b9780a; --accent-ink:#fff;
}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text); font-family:var(--font);
  font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
img,canvas{max-width:100%;display:block}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}

/* ---------- layout ---------- */
#app{min-height:100vh;min-height:100dvh;padding-bottom:calc(74px + var(--safe-b))}
.topbar{
  position:sticky;top:0;z-index:50;background:rgba(13,15,18,.86);
  backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);
  border-bottom:1px solid var(--border-soft);
  padding:calc(10px + var(--safe-t)) 16px 10px;
  display:flex;align-items:center;gap:12px;min-height:56px;
}
:root[data-theme="light"] .topbar{background:rgba(246,247,249,.9)}
.topbar h1{font-size:17px;margin:0;font-weight:650;letter-spacing:-.01em;flex:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{
  background:var(--elev);border:1px solid var(--border);border-radius:10px;
  width:36px;height:36px;display:grid;place-items:center;flex:0 0 auto;font-size:15px;padding:0
}
.iconbtn:active{background:var(--elev2)}
.wrap{padding:16px;max-width:760px;margin:0 auto}
.page{display:none}
.page.on{display:block;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- bottom nav ---------- */
.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  background:rgba(21,25,30,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--border);
  display:flex;padding:6px 4px calc(6px + var(--safe-b));
}
:root[data-theme="light"] .nav{background:rgba(255,255,255,.95)}
.nav button{
  flex:1;background:none;border:0;padding:7px 2px;border-radius:12px;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:10.5px;color:var(--faint);font-weight:600;letter-spacing:.01em;
}
.nav button .ic{font-size:19px;line-height:1}
.nav button.on{color:var(--accent)}

/* ---------- generic ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin:0 0 12px}
.card.pad0{padding:0;overflow:hidden}
h2{font-size:20px;margin:22px 0 10px;letter-spacing:-.015em;font-weight:680}
h3{font-size:16px;margin:18px 0 8px;font-weight:650}
p{margin:0 0 11px}
ul,ol{margin:0 0 11px;padding-left:22px}
li{margin:0 0 6px}
small{font-size:13px;color:var(--muted)}
.muted{color:var(--muted)}
.tiny{font-size:12.5px;line-height:1.5;color:var(--muted)}
hr{border:0;border-top:1px solid var(--border-soft);margin:18px 0}
code{background:var(--elev2);padding:1px 6px;border-radius:6px;font-size:13.5px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.pill{
  display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:650;
  padding:3px 9px;border-radius:999px;background:var(--elev2);color:var(--muted);
  border:1px solid var(--border);letter-spacing:.02em;
}
.pill.n1{color:var(--n1);border-color:color-mix(in srgb,var(--n1) 40%,transparent)}
.pill.n2{color:var(--n2);border-color:color-mix(in srgb,var(--n2) 40%,transparent)}
.pill.n3{color:var(--n3);border-color:color-mix(in srgb,var(--n3) 40%,transparent)}
.pill.n4{color:var(--n4);border-color:color-mix(in srgb,var(--n4) 40%,transparent)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  background:var(--accent);color:var(--accent-ink);border:0;border-radius:11px;
  padding:12px 16px;font-weight:680;font-size:14.5px;width:100%;
}
.btn:active{filter:brightness(.93)}
.btn.ghost{background:var(--elev);color:var(--text);border:1px solid var(--border)}
.btn.sm{padding:9px 12px;font-size:13.5px;width:auto}
.row{display:flex;gap:9px;flex-wrap:wrap}
.row>.btn{flex:1;width:auto}

/* ---------- tables ---------- */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 0 12px;
  border:1px solid var(--border);border-radius:var(--rs)}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:100%}
th,td{padding:9px 11px;text-align:left;border-bottom:1px solid var(--border-soft);vertical-align:top}
th{background:var(--elev2);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;
  color:var(--muted);font-weight:700;white-space:nowrap}
tr:last-child td{border-bottom:0}
td strong{font-weight:650}

/* ---------- progress ---------- */
.bar{height:6px;background:var(--elev2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--teal));
  border-radius:99px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.hero{
  background:
    radial-gradient(120% 90% at 85% 0%, color-mix(in srgb,var(--accent) 22%,transparent), transparent 62%),
    radial-gradient(110% 80% at 8% 100%, color-mix(in srgb,var(--teal) 16%,transparent), transparent 60%),
    var(--surface);
  border:1px solid var(--border);border-radius:18px;padding:18px;margin-bottom:16px
}
.hero .k{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.hero .big{font-size:29px;font-weight:720;letter-spacing:-.025em;margin:6px 0 2px;line-height:1.1}
.stats{display:flex;gap:8px;margin-top:14px}
.stat{flex:1;background:color-mix(in srgb,var(--bg) 45%,transparent);border:1px solid var(--border-soft);
  border-radius:11px;padding:9px 10px;text-align:center}
.stat b{display:block;font-size:19px;font-weight:700;letter-spacing:-.02em}
.stat span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:650}

/* ---------- lesson list ---------- */
.lvl{margin:22px 0 10px;display:flex;align-items:center;gap:9px}
.lvl .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.lvl h2{margin:0;font-size:15px;letter-spacing:.02em;text-transform:uppercase;font-weight:700}
.lvl small{margin-left:auto;font-size:12px;white-space:nowrap}
.les{
  display:flex;gap:12px;align-items:center;width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--rs);
  padding:12px 13px;margin-bottom:8px;
}
.les:active{background:var(--elev)}
.les .num{
  flex:0 0 auto;width:31px;height:31px;border-radius:9px;background:var(--elev2);
  display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--muted)
}
.les.done .num{background:color-mix(in srgb,var(--ok) 22%,transparent);color:var(--ok)}
.les .t{flex:1;min-width:0}
.les .t b{display:block;font-size:14.5px;font-weight:620;letter-spacing:-.01em;line-height:1.35}
.les .t span{font-size:12px;color:var(--faint)}
.les .go{color:var(--faint);font-size:17px;flex:0 0 auto}
.les.soon{opacity:.62}

/* ---------- lesson detail ---------- */
.sec{margin:0 0 14px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface);overflow:hidden}
.sec>summary{
  padding:14px 15px;font-weight:660;font-size:14.5px;cursor:pointer;list-style:none;
  display:flex;align-items:center;gap:10px;
}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary .ic{font-size:16px}
.sec>summary::after{content:"▾";margin-left:auto;color:var(--faint);font-size:12px;transition:transform .2s}
.sec[open]>summary::after{transform:rotate(180deg)}
.sec[open]>summary{border-bottom:1px solid var(--border-soft)}
.secbody{padding:15px}
.eng{
  background:color-mix(in srgb,var(--teal) 11%,transparent);
  border:1px solid color-mix(in srgb,var(--teal) 32%,transparent);
  border-radius:var(--rs);padding:13px 14px;margin:14px 0
}
.eng .h{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;font-weight:750;
  color:var(--teal);margin-bottom:7px;display:flex;align-items:center;gap:6px}
.eng p:last-child,.eng ul:last-child{margin-bottom:0}
.note{
  background:color-mix(in srgb,var(--accent) 12%,transparent);
  border-left:3px solid var(--accent);border-radius:8px;padding:11px 13px;margin:13px 0;font-size:14px
}
.note.warn{background:color-mix(in srgb,var(--bad) 12%,transparent);border-left-color:var(--bad)}
.note p:last-child{margin-bottom:0}
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{counter-increment:s;position:relative;padding:0 0 13px 38px;margin:0}
.steps li::before{
  content:counter(s);position:absolute;left:0;top:0;width:26px;height:26px;border-radius:8px;
  background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;
  font-size:12.5px;font-weight:750
}
.steps li::after{content:"";position:absolute;left:12.5px;top:29px;bottom:2px;width:1px;background:var(--border)}
.steps li:last-child::after{display:none}
.path{
  display:inline-block;background:var(--elev2);border:1px solid var(--border);
  border-radius:7px;padding:2px 8px;font-size:13px;font-weight:600;margin:2px 0
}
.vid{
  display:block;background:var(--elev);border:1px solid var(--border);border-radius:var(--rs);
  padding:12px 13px;margin-bottom:9px;text-decoration:none;color:var(--text)
}
.vid b{display:block;font-size:14px;font-weight:640;line-height:1.35;margin-bottom:4px}
.vid .meta{font-size:12px;color:var(--muted)}
.vid .look{font-size:13px;margin-top:7px;color:var(--text)}
.searchbox{
  background:var(--elev2);border:1px dashed var(--border);border-radius:var(--rs);
  padding:11px 13px;margin-bottom:9px;font-size:13.5px
}
.searchbox .q{font-family:ui-monospace,Menlo,monospace;font-size:13px;display:block;
  background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:7px 9px;margin:7px 0 0}
.ck{display:flex;gap:11px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--border-soft)}
.ck:last-child{border-bottom:0}
.ck input{width:21px;height:21px;flex:0 0 auto;margin:1px 0 0;accent-color:var(--accent)}
.ck label{flex:1;font-size:14px;line-height:1.45}
.ck input:checked+label{color:var(--muted);text-decoration:line-through}

/* ---------- tools ---------- */
.toolcard{
  display:flex;gap:13px;align-items:center;width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:14px;margin-bottom:10px
}
.toolcard:active{background:var(--elev)}
.toolcard .em{font-size:25px;flex:0 0 auto;width:44px;height:44px;border-radius:12px;
  background:var(--elev2);display:grid;place-items:center}
.toolcard .t b{display:block;font-size:15px;font-weight:640}
.toolcard .t span{font-size:12.5px;color:var(--muted);line-height:1.4;display:block;margin-top:2px}
.ctl{margin:0 0 15px}
.ctl .lab{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;
  font-weight:640;margin-bottom:7px;gap:10px}
.ctl .lab span{color:var(--accent);font-variant-numeric:tabular-nums;font-weight:700;
  font-family:ui-monospace,Menlo,monospace;font-size:13.5px}
input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0
}
input[type=range]::-webkit-slider-runnable-track{height:5px;background:var(--elev2);border-radius:99px;border:1px solid var(--border)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;
  background:var(--accent);border:3px solid var(--bg);margin-top:-10.5px;box-shadow:0 1px 5px rgba(0,0,0,.5)}
input[type=range]::-moz-range-track{height:5px;background:var(--elev2);border-radius:99px}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--accent);border:3px solid var(--bg)}
.seg{display:flex;gap:6px;background:var(--elev2);border:1px solid var(--border);
  border-radius:11px;padding:4px;margin:0 0 14px;overflow-x:auto}
.seg button{flex:1;background:none;border:0;border-radius:8px;padding:8px 10px;
  font-size:13px;font-weight:640;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.cv{width:100%;border-radius:var(--rs);border:1px solid var(--border);background:#000;display:block}
.readout{display:flex;gap:8px;margin:12px 0}
.readout div{flex:1;background:var(--elev);border:1px solid var(--border);border-radius:10px;
  padding:9px;text-align:center}
.readout b{display:block;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.readout span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:650}
.verdict{border-radius:10px;padding:11px 13px;margin:12px 0;font-size:13.5px;font-weight:600;
  border:1px solid var(--border);background:var(--elev)}
.verdict.ok{border-color:color-mix(in srgb,var(--ok) 45%,transparent);
  background:color-mix(in srgb,var(--ok) 13%,transparent)}
.verdict.warn{border-color:color-mix(in srgb,var(--warn) 45%,transparent);
  background:color-mix(in srgb,var(--warn) 13%,transparent)}
.verdict.bad{border-color:color-mix(in srgb,var(--bad) 45%,transparent);
  background:color-mix(in srgb,var(--bad) 13%,transparent)}
.sw{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.sw .s{flex:1;min-width:66px;border-radius:10px;border:1px solid var(--border);overflow:hidden;
  background:var(--elev)}
.sw .s .c{height:56px}
.sw .s .n{font-size:10px;padding:5px 4px;text-align:center;font-family:ui-monospace,Menlo,monospace;
  color:var(--muted);letter-spacing:-.02em}
.filein{
  border:1px dashed var(--border);border-radius:var(--rs);padding:22px 14px;text-align:center;
  background:var(--elev);font-size:14px;color:var(--muted);margin-bottom:12px;display:block
}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 13px}
.chip{background:var(--elev2);border:1px solid var(--border);border-radius:99px;padding:7px 13px;
  font-size:12.5px;font-weight:640;color:var(--muted)}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
textarea{
  width:100%;background:var(--elev);border:1px solid var(--border);border-radius:10px;
  color:var(--text);padding:11px;font-family:inherit;font-size:14px;line-height:1.5;resize:vertical
}
select,input[type=number]{
  background:var(--elev);border:1px solid var(--border);border-radius:9px;color:var(--text);
  padding:9px 10px;font-family:inherit;font-size:14px;width:100%
}
.grade{display:flex;gap:9px;align-items:center;margin-bottom:9px}
.grade select{flex:1}
.toast{
  position:fixed;left:50%;transform:translateX(-50%) translateY(120%);
  bottom:calc(88px + var(--safe-b));background:var(--elev2);color:var(--text);
  border:1px solid var(--border);border-radius:11px;padding:11px 17px;font-size:13.5px;font-weight:620;
  z-index:200;transition:transform .3s cubic-bezier(.2,.9,.2,1);box-shadow:0 8px 28px rgba(0,0,0,.45);
  max-width:90vw;text-align:center
}
.toast.on{transform:translateX(-50%) translateY(0)}
.empty{text-align:center;padding:40px 18px;color:var(--muted)}
.empty .em{font-size:40px;margin-bottom:10px}
@media(min-width:620px){
  .wrap{padding:22px}
  .hero .big{font-size:33px}
}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <button class="iconbtn" id="back" style="display:none" aria-label="Volver">‹</button>
    <h1 id="title">Enfoque</h1>
    <button class="iconbtn" id="theme" aria-label="Tema">◐</button>
  </div>

  <div class="page on" id="p-curso"><div class="wrap" id="v-curso"></div></div>
  <div class="page" id="p-leccion"><div class="wrap" id="v-leccion"></div></div>
  <div class="page" id="p-tools"><div class="wrap" id="v-tools"></div></div>
  <div class="page" id="p-tool"><div class="wrap" id="v-tool"></div></div>
  <div class="page" id="p-estado"><div class="wrap" id="v-estado"></div></div>

  <nav class="nav">
    <button data-go="curso" class="on"><span class="ic">📚</span>Curso</button>
    <button data-go="tools"><span class="ic">🎛️</span>Herramientas</button>
    <button data-go="estado"><span class="ic">📊</span>Estado</button>
  </nav>
</div>
<div class="toast" id="toast"></div>
<script>
/* ============================================================
   ENFOQUE — Curso de fotografía para Galaxy S25+
   Datos del curso
   ============================================================ */

const PHONE = {
  lentes: [
    ['Principal (1x)','50 MP','f/1.8','24 mm','1/1.56"','Sí (OIS)'],
    ['Ultra gran angular (0.6x)','12 MP','f/2.2','13 mm','1/2.55"','No — foco fijo'],
    ['Teleobjetivo (3x)','10 MP','f/2.4','67 mm','1/3.94"','Sí (OIS)'],
    ['Frontal','12 MP','f/2.2','26 mm','1/3.2"','No, pero tiene autofoco']
  ]
};

const LEVELS = [
  {id:1, name:'Nivel 1 · Básico',     sub:'Fundamentos',            color:'n1'},
  {id:2, name:'Nivel 2 · Intermedio', sub:'Luz, color y modos',     color:'n2'},
  {id:3, name:'Nivel 3 · Avanzado',   sub:'Control manual',         color:'n3'},
  {id:4, name:'Nivel 4 · Experto',    sub:'Integración y estilo',   color:'n4'}
];

/* Nota de rigor: los enlaces de video son los que aparecieron en búsquedas
   reales. Cuando no pude confirmar canal o duración, lo digo explícitamente.
   Nunca hay un enlace inventado. */

const LESSONS = [
/* ================= NIVEL 1 ================= */
{
n:1, lvl:1, ready:true,
title:'Conoce tu S25+',
dur:'1 semana',
obj:'Identificar los cuatro lentes de tu teléfono, saber cuál usar, entender la interfaz de la app Camera, y sostener el teléfono de forma estable y limpia.',
teoria:`
<p>Tu S25+ no tiene "una cámara": tiene <strong>cuatro cámaras físicas distintas</strong>, cada una con su propio sensor y su propio lente de vidrio. Cuando tocas "0.6x", "1x" o "3x" en la pantalla, no estás acercando nada: estás <strong>cambiando de cámara</strong>, como un fotógrafo que cambia de objetivo.</p>

<p>La analogía: imaginá tres ventanas en una pared. Una es panorámica y muestra toda la calle (ultra gran angular). Otra es una ventana normal, parecida a lo que ve tu ojo (principal). La tercera es un catalejo empotrado que muestra sólo la casa de enfrente, pero grande (teleobjetivo). No hay una "mejor" ventana: hay una adecuada para cada cosa que quieras mostrar.</p>

<h3>Los cuatro lentes de tu teléfono</h3>
<div class="tw"><table>
<thead><tr><th>Lente</th><th>Resolución</th><th>Apertura</th><th>Focal equiv.</th><th>Sensor</th><th>Estabilizador</th></tr></thead>
<tbody id="tbl-lentes"></tbody>
</table></div>

<p><strong>Dos avisos importantes antes de seguir:</strong></p>
<ul>
<li><strong>El "2x" no es un lente.</strong> Es un recorte del centro del sensor principal de 50 MP. Samsung lo llama "calidad óptica" porque el recorte de un sensor tan grande da resultados muy buenos, pero físicamente sigue siendo un recorte. El único zoom óptico real de tu teléfono es el <strong>3x</strong>.</li>
<li><strong>El ultra gran angular no enfoca.</strong> Tiene foco fijo: todo lo que esté a más de unos 30 o 40 cm sale nítido, pero no podés hacer primeros planos con él. Es una limitación de hardware, no un ajuste que puedas cambiar.</li>
</ul>

<h3>Lo que más mejora tus fotos, y es gratis</h3>
<p>Antes que cualquier ajuste: <strong>el lente está sucio</strong>. Tu teléfono vive en un bolsillo. Una capa invisible de grasa de los dedos hace exactamente lo que hace un filtro difusor: baja el contraste, apaga los colores y, a contraluz, provoca esos destellos lechosos que arruinan la foto. Limpiar el vidrio con la parte de la remera o con un paño de microfibra, cada vez, antes de disparar, mejora más tus fotos que cualquier cosa que aprendas en este curso.</p>

<h3>Cómo sostener el teléfono</h3>
<p>El enemigo número uno de la nitidez no es la cámara: es el temblor de tu mano. Un teléfono es un objeto liviano y plano, o sea la peor forma posible para mantener algo quieto. Tres reglas:</p>
<ul>
<li><strong>Dos manos, siempre.</strong> Una sostiene, la otra estabiliza por el otro borde.</li>
<li><strong>Codos apoyados en el cuerpo</strong>, no en el aire. Convierte tus brazos en un trípode con tu torso.</li>
<li><strong>Dispará con el botón de volumen</strong>, no tocando la pantalla. Al tocar la pantalla empujás el teléfono justo en el momento del disparo.</li>
</ul>
<p>Y respirá: exhalá, retené, disparás, respirás. Es la misma técnica del tiro deportivo, y por la misma razón.</p>
`,
eng:`
<p><strong>Por qué el sensor principal es tan superior al resto.</strong> Su sensor mide 1/1.56", el del teleobjetivo mide 1/3.94". En área de captación de luz esa diferencia es de aproximadamente 6 veces. Como la relación señal a ruido escala con la raíz cuadrada del número de fotones capturados, el sensor grande te da aproximadamente 2.5 veces mejor SNR con la misma escena. Por eso en interiores el 3x se ve ruidoso y el 1x se ve limpio.</p>

<p><strong>Pixel binning.</strong> El sensor principal tiene 50 millones de fotodiodos de 1.0 µm dispuestos en un patrón Quad-Bayer: cada grupo de 2x2 fotodiodos comparte el mismo color de filtro. Por defecto el ISP suma las cargas de cada grupo de cuatro y entrega un archivo de 12.5 MP con píxeles efectivos de 2.0 µm. Estás cambiando resolución por sensibilidad y por menos ruido. En la lección 2 vemos cuándo conviene desactivarlo.</p>

<p><strong>Apertura fija.</strong> f/1.8, f/2.2 y f/2.4 son números grabados en el vidrio. No hay diafragma mecánico en tu S25+. Consecuencia directa: el clásico triángulo de exposición (apertura, velocidad, ISO) en tu teléfono es en realidad un <em>segmento</em> de dos variables. Lo vemos a fondo en la lección 15.</p>

<p><strong>OIS.</strong> El módulo principal y el teleobjetivo tienen estabilización óptica: un actuador de bobina móvil desplaza el grupo de lentes para compensar la rotación que mide el giroscopio, unas cientos de veces por segundo. Te regala unos 3 o 4 pasos de exposición a mano alzada. El ultra gran angular no lo tiene, y por eso rinde peor de noche.</p>

title:'Ajustes esenciales',

obj:'Configurar tu cámara una sola vez y bien: cuadrícula, nivel, relación de aspecto, resolución, y entender qué hace el Scene Optimizer. Instalar Camera Assistant.',
teoria:`
<p>La app Camera viene configurada para el usuario promedio, que quiere una foto decente sin pensar. Vos querés aprender, así que hay que cambiar algunas cosas. Son cinco minutos, una sola vez.</p>

<h3>1. La cuadrícula y el nivel</h3>
<p>Activar las líneas de cuadrícula es lo más barato que podés hacer por tus fotos. Divide la pantalla en nueve casilleros y sirve para dos cosas: encuadrar según la regla de tercios, que vemos en la lección 4, y sobre todo <strong>enderezar el horizonte</strong>. Un horizonte torcido tres grados arruina una foto de paisaje, y a ojo no se nota hasta que la ves en la compu.</p>

<h3>2. Relación de aspecto: 3:4, 9:16 y 1:1</h3>
<p>La relación de aspecto es la forma del rectángulo de tu foto. Tu sensor entrega nativamente <strong>3:4</strong>: ese es el recorte completo, el que usa todos los píxeles. Cualquier otra opción recorta.</p>
<div class="tw"><table>
<thead><tr><th>Relación</th><th>Qué es</th><th>Cuándo usarla</th></tr></thead>
<tbody>
<tr><td><strong>3:4</strong></td><td>El formato nativo del sensor, sin recortes</td><td>Por defecto. Siempre que dudes.</td></tr>
<tr><td><strong>9:16</strong></td><td>Vertical largo, recorta los costados</td><td>Historias de Instagram, reels. Pero conviene sacar en 3:4 y recortar después.</td></tr>
<tr><td><strong>1:1</strong></td><td>Cuadrado</td><td>Casi nunca al disparar. Recortá después.</td></tr>
<tr><td><strong>Full</strong></td><td>Llena la pantalla del teléfono</td><td>No la recomiendo: no coincide con ningún formato de impresión ni de red.</td></tr>
</tbody></table></div>
<p><strong>Regla general:</strong> disparar siempre en el formato más grande, o sea 3:4, y recortar después. Recortar es gratis. Volver a poner píxeles que no capturaste es imposible.</p>

<h3>3. ¿50 MP o 12 MP?</h3>
<p>Aunque tu sensor principal tiene 50 MP, por defecto guarda archivos de 12 MP. No es un error. Es pixel binning, agrupar cuatro fotodiodos en uno, para reducir ruido.</p>
<div class="tw"><table>
<thead><tr><th>Modo</th><th>Peso típico</th><th>Ventaja</th><th>Desventaja</th></tr></thead>
<tbody>
<tr><td><strong>12 MP (por defecto)</strong></td><td>3 a 5 MB</td><td>Menos ruido, HDR completo, procesamiento total, archivos livianos</td><td>Menos margen para recortar</td></tr>
<tr><td><strong>50 MP</strong></td><td>15 a 25 MB</td><td>Máximo detalle, permite recortes agresivos</td><td>Necesita mucha luz, ocupa 4 o 5 veces más, HDR limitado</td></tr>
</tbody></table></div>
<p><strong>Mi recomendación para tu perfil:</strong> dejá 12 MP. Para redes sociales y viajes en familia, 12 MP es más de lo que necesitás, y con 256 GB vas a agradecer el espacio. Usá 50 MP sólo en paisajes a plena luz de día donde sospeches que vas a querer recortar.</p>

<h3>4. Scene Optimizer: el ayudante que a veces se pasa</h3>
<p>El Scene Optimizer es un clasificador que reconoce la escena (comida, atardecer, césped, texto, mascota) y aplica un perfil de color más intenso. En un atardecer levanta los naranjas, en un paisaje satura los verdes. A veces queda espectacular; otras veces queda artificial, con verdes de plástico.</p>
<p><strong>Para tu estilo, que es limpio y de color natural, te sugiero desactivarlo</strong> y juzgar por tu cuenta. Podés volver a activarlo cuando quieras.</p>

<h3>5. Camera Assistant: el panel de control escondido</h3>
<p>Camera Assistant es un módulo oficial de Samsung, gratis, que agrega ajustes que la app no expone. Se instala desde Galaxy Store. Es la pieza que más te va a servir en las lecciones de retrato y de mascotas, porque permite fijar una <strong>velocidad mínima de obturación</strong>: le decís a la cámara "nunca bajes de 1/125" y dejás de tener fotos borrosas de tu hija corriendo.</p>
<div class="note">
<p><strong>Aviso de rigor:</strong> verifiqué que Samsung amplió Camera Assistant con One UI 8.5 y que incluye opciones de velocidad mínima de obturación. Lo que <strong>no</strong> pude confirmar es exactamente qué opciones aparecen en tu S25+ con tu versión. Cuando lo instales, mandame una captura de la lista y ajustamos juntos.</p>
</div>
`,
eng:`
<p><strong>La matemática del pixel binning.</strong> Cuatro fotodiodos de 1.0 µm agrupados equivalen a un fotositio de 2.0 µm, o sea 4 veces el área. El ruido de disparo (shot noise) sigue una distribución de Poisson: su desviación estándar es la raíz cuadrada del número de electrones. Si capturás 4 veces más fotones, la señal se multiplica por 4 y el ruido por 2, así que la relación señal a ruido mejora por un factor de 2, o sea un paso completo de exposición. Ese es el precio real que pagás al pasar a 50 MP: un paso de ruido.</p>

<p><strong>Por qué el modo 50 MP limita el HDR.</strong> El HDR de Samsung funciona fusionando varias exposiciones consecutivas. En modo binned el sensor entrega lecturas rápidas de 12.5 MP y el ISP puede apilar varios cuadros dentro del tiempo del disparo. En 50 MP cada lectura del sensor es 4 veces más pesada, el ancho de banda del bus MIPI se vuelve el cuello de botella y el apilado se reduce o desaparece. De ahí que las fotos de 50 MP tengan menos rango dinámico aunque tengan más píxeles: perdiste fotografía computacional para ganar resolución.</p>

<p><strong>JPEG vs HEIF.</strong> HEIF usa el codec HEVC intra-frame y consigue calidad equivalente en aproximadamente la mitad del tamaño, con soporte de 10 bits por canal. El costo es compatibilidad: algunos servicios viejos no lo abren. Para redes sociales, que recomprimen todo de todas formas, HEIF te ahorra la mitad del almacenamiento sin pérdida visible.</p>
`,

{
n:3, lvl:1, ready:true,
title:'Enfoque y exposición en automático',
dur:'1 semana',
obj:'Dejar de aceptar lo que decide la cámara: elegir vos dónde enfoca, bloquear el enfoque y la exposición, y corregir el brillo antes de disparar.',
teoria:`
<p>Cuando apuntás y disparás, tu teléfono toma dos decisiones por vos: <strong>dónde enfocar</strong> y <strong>cuánta luz dejar entrar</strong>. Las toma bien el 80% de las veces. Esta lección es sobre el otro 20%, que es justamente donde están las fotos que te importan.</p>

<h3>Tocar para enfocar</h3>
<p>Tocá la pantalla sobre tu sujeto y aparece un marco. Le acabás de decir a la cámara: "esto es lo importante". La cámara enfoca ahí <strong>y además mide la luz ahí</strong>. Son dos cosas al mismo tiempo, y esto es clave para entender los errores que vienen.</p>

<h3>El control que casi nadie usa: la compensación de exposición</h3>
<p>Cuando tocás para enfocar aparece, al costado del marco, un <strong>deslizador con un solito o un ícono de brillo</strong>. Arrastrándolo hacia arriba la foto se aclara, hacia abajo se oscurece. Eso es la compensación de exposición, y es el único control "manual" que necesitás en el modo automático.</p>
<p>¿Por qué hace falta? Porque el medidor de tu cámara no sabe qué estás fotografiando. Está calibrado para que <strong>el promedio de la escena quede en un gris medio</strong>. Dos casos clásicos donde eso falla:</p>
<ul>
<li><strong>Nieve, arena clara, una pared blanca:</strong> la escena es más clara que un gris medio, la cámara la oscurece y la nieve te sale gris sucia. Solución: subir la exposición, entre +0.7 y +1.5.</li>
<li><strong>Un foco de luz sobre fondo oscuro, una escena nocturna:</strong> la cámara aclara todo, el negro se vuelve gris ruidoso y las luces se quiebran. Solución: bajar la exposición, entre -0.7 y -1.5.</li>
</ul>
<p>La regla mnemotécnica: <strong>escena clara, subir; escena oscura, bajar.</strong> Suena al revés y por eso se olvida.</p>

<h3>Bloquear AE/AF: el gesto que separa a un aficionado de alguien que sabe</h3>
<p><strong>Tocá y mantené presionado</strong> sobre el punto donde querés enfocar. Aparece un candado o la sigla <strong>AE/AF LOCK</strong>. Acabás de congelar el enfoque y la exposición: podés recomponer el encuadre, moverte, esperar, y esos valores no cambian.</p>
<p>Para qué sirve, en concreto:</p>
<ul>
<li><strong>Retrato a contraluz.</strong> Medís sobre la cara de tu esposa, bloqueás, recomponés. La cara queda bien expuesta aunque el fondo se queme.</li>
<li><strong>El gato.</strong> Enfocás donde el gato va a estar, bloqueás y esperás. El autofoco no se te va a ir al sillón cuando el gato se mueva.</li>
<li><strong>Video consistente.</strong> Evita el salto de brillo cuando pasás la cámara por una zona clara.</li>
</ul>
<div class="note">
<p><strong>Ojo con el efecto combinado.</strong> Como "tocar" mide y enfoca a la vez, si tocás una zona oscura para enfocar, la cámara además aclara toda la foto. Ese es el origen de la mitad de las fotos "mal expuestas" que la gente culpa al teléfono.</p>
</div>

<h3>Sombras y luces: el HDR que ya está trabajando</h3>
<p>Tu S25+ tiene HDR automático permanente. En una escena de alto contraste dispara varias exposiciones en milisegundos y las fusiona. Por eso muchas veces no necesitás compensar nada: el teléfono ya rescató el cielo y las sombras. Pero el HDR tiene un límite, y cuando lo pasás aparecen los halos y los cielos grises y planos. Eso lo trabajamos en la lección 8.</p>
`,
eng:`
<p><strong>Cómo mide tu cámara.</strong> El sistema de medición divide el cuadro en una matriz de zonas y pondera sus luminancias según un modelo entrenado. La referencia es la reflectancia media del 18%, el gris medio, que refleja aproximadamente la mitad de la luz que recibe en términos perceptuales. Todo medidor asume que el mundo promedia gris medio. Cuando la escena no cumple ese supuesto, el medidor falla de forma predecible, y la compensación de exposición es el término correctivo que le aplicás.</p>

<p><strong>Qué hace realmente la compensación en un teléfono.</strong> Como la apertura es fija, mover el deslizador +1 EV sólo puede hacer dos cosas: duplicar el tiempo de integración del sensor o duplicar la ganancia analógica (ISO). El ISP prefiere lo primero mientras el tiempo no ponga en riesgo la nitidez, y recién después toca la ganancia. Es decir: cada paso de exposición que pedís se paga en movimiento borroso o en ruido. No hay un tercer lugar de donde sacarlo.</p>

<p><strong>Dual Pixel AF.</strong> Cada fotodiodo del sensor principal está dividido en dos mitades con microlente compartida. Comparando la fase de las dos mitades el ISP calcula no sólo si está desenfocado, sino <em>en qué dirección y cuánto</em>, y manda el actuador al punto correcto en un solo movimiento. Es lo mismo que hace un telémetro de coincidencia, resuelto en silicio. De ahí que el enfoque del 1x sea casi instantáneo, mientras que el ultra gran angular, que no tiene autofoco, simplemente no participa.</p>

teoria:`
<p>Hasta acá trabajamos la máquina. Desde acá trabajamos el ojo, y esto es lo que de verdad separa una foto buena de una foto más. Una cámara de 50 MP con una mala composición da una foto mala en alta resolución.</p>

<h3>La regla de tercios</h3>
<p>Dividí el cuadro en tres franjas horizontales y tres verticales: te quedan nueve casilleros y cuatro puntos de cruce. La regla dice: <strong>poné lo importante sobre una línea o, mejor, sobre un cruce</strong>, no en el centro.</p>
<p>¿Por qué funciona? Porque el centro geométrico es el lugar más estable y por lo tanto el más aburrido. Correr el sujeto genera una asimetría que el ojo recorre, y ese recorrido es lo que hace que una foto "se mire" en lugar de "se vea".</p>
<p>En paisaje esto se traduce en una decisión concreta con el horizonte:</p>
<div class="tw"><table>
<thead><tr><th>Horizonte en...</th><th>Efecto</th><th>Cuándo</th></tr></thead>
<tbody>
<tr><td><strong>Tercio inferior</strong></td><td>Dos tercios de cielo: la foto habla del cielo</td><td>Atardeceres, nubes dramáticas, cielos con color</td></tr>
<tr><td><strong>Tercio superior</strong></td><td>Dos tercios de suelo: la foto habla del terreno</td><td>Campos, reflejos en agua, texturas de tierra o piedra</td></tr>
<tr><td><strong>Centro exacto</strong></td><td>Simetría total</td><td>Sólo cuando la simetría es el tema: un reflejo perfecto en un lago quieto</td></tr>
</tbody></table></div>
<p>El error clásico del principiante es el horizonte en el medio <em>sin haberlo decidido</em>. Partís la foto en dos mitades que compiten y ninguna gana.</p>

<h3>El horizonte torcido</h3>
<p>No hay excepción a esto: en una foto de paisaje, <strong>el horizonte va derecho</strong>. Tu ojo tiene una referencia absoluta de horizontalidad, el sistema vestibular, y detecta un error de dos grados aunque no sepa nombrarlo. La sensación es de incomodidad difusa, que el espectador atribuye a la foto en general.</p>
<p>Se arregla en dos lugares: con la cuadrícula al encuadrar, y con la herramienta de rotación al editar. Usá las dos.</p>

<h3>Simplicidad: fotografiar es restar</h3>
<p>Un principiante ve algo lindo, apunta y aprieta. Lo que captura es "todo lo que había ahí". Un fotógrafo se pregunta primero <strong>qué es el tema</strong>, y después saca del cuadro todo lo que no ayude a contarlo.</p>
<p>Tres maneras de restar, sin tocar ningún ajuste:</p>
<ul>
<li><strong>Acercarte.</strong> Con los pies, no con el zoom. Todo lo que sobra sale del cuadro solo.</li>
<li><strong>Cambiar de altura.</strong> Agachate y el piso desordenado se va; subí un escalón y los autos estacionados desaparecen detrás del muro.</li>
<li><strong>Cambiar de ángulo.</strong> Dos pasos al costado y el tacho de basura queda fuera del cuadro.</li>
</ul>
<p>Antes de disparar, hacé un barrido consciente por los <strong>cuatro bordes</strong> del encuadre buscando intrusos: un poste cortado, una mano ajena, un cartel. Cuesta tres segundos y salva más fotos que cualquier edición.</p>

<h3>Un solo sujeto</h3>
<p>Una foto puede contar una cosa bien o cinco cosas mal. Si al mirar tu foto alguien tiene que preguntar "¿qué querías mostrar?", la respuesta es que había más de un tema. Elegí uno y subordiná todo lo demás.</p>
`,
eng:`
<p><strong>Qué hay de real en la regla de tercios.</strong> No hay un mecanismo neurológico que privilegie exactamente la posición 1/3. Lo que sí está bien documentado es que el sistema visual humano explora una imagen mediante sacadas, saltos rápidos de la mirada entre puntos de alto contenido informativo, y que un sujeto descentrado genera una secuencia de sacadas más larga y por lo tanto más tiempo de atención. La regla de tercios es una heurística sencilla que produce descentramiento sin caer en el borde del cuadro, donde el sujeto se lee como recortado. Es ingeniería de usabilidad visual, no una constante de la naturaleza.</p>

<p><strong>Por qué se detecta un horizonte torcido.</strong> Tu cerebro fusiona la señal de los canales semicirculares del oído interno con las verticales y horizontales que detecta en la escena. Cuando la imagen presenta una horizontal dominante inclinada, aparece un conflicto entre la referencia gravitatoria y la visual. Ese conflicto se percibe como malestar antes de identificarse como error técnico. Es el mismo mecanismo que produce el mareo de simulador.</p>

<p><strong>Costo de enderezar en edición.</strong> Rotar una imagen obliga a recortar el rectángulo inscrito más grande y a remuestrear cada píxel por interpolación. Para una rotación de 3 grados perdés cerca del 10% del área y un poco de nitidez. Enderezar al encuadrar es gratis. Enderezar después se paga en píxeles.</p>
`,

obj:'Usar líneas guía, encuadres naturales, espacio negativo y altura de cámara para conducir la mirada del espectador. Encuadrar para vertical de redes sin perder la foto.',
teoria:`
<p>En la lección anterior ordenaste el cuadro. Ahora vas a <strong>dirigir</strong> al espectador dentro de él. Esto es lo que hace que una foto de un lugar cualquiera se vea profesional.</p>

<h3>Líneas guía</h3>
<p>El ojo sigue las líneas. Es casi un reflejo. Un camino, una vía, una baranda, la orilla de un río, la juntura de las baldosas, una fila de árboles: todo eso es una flecha apuntando a algún lugar. Tu trabajo es que apunte <strong>a tu sujeto</strong>, y no a la nada.</p>
<p>Las líneas más potentes son las <strong>diagonales</strong>, y las que arrancan en una esquina inferior del cuadro son las más potentes de todas: el ojo occidental entra a la imagen por abajo a la izquierda.</p>

<h3>Encuadre natural</h3>
<p>Poner algo del entorno alrededor del sujeto: el arco de una puerta, las ramas de un árbol, el marco de una ventana, el hueco entre dos paredes. Hace tres cosas a la vez: aísla al sujeto, tapa lo que sobra, y agrega una capa de profundidad. En fotografía de viaje es casi una receta: una puerta vieja encuadrando la plaza.</p>

<h3>Espacio negativo</h3>
<p>El espacio vacío alrededor del sujeto no es espacio desperdiciado: es lo que hace que el sujeto respire. Un sujeto chico en un cuadro grande y limpio, por ejemplo tu hija corriendo en una playa vacía, produce una lectura inmediata de escala y soledad. Es exactamente lo contrario de llenar el cuadro, y en tu estilo simple y limpio es una herramienta central.</p>

<h3>Altura de cámara: el ajuste que nadie usa</h3>
<p>Casi todas las fotos del mundo están sacadas desde 1,60 m de altura, porque es donde está la cara de quien dispara. Cambiar de altura es gratis y transforma la imagen:</p>
<div class="tw"><table>
<thead><tr><th>Altura</th><th>Qué provoca</th><th>Usala para</th></tr></thead>
<tbody>
<tr><td><strong>Al nivel del piso</strong></td><td>Engrandece, dramatiza, limpia el fondo contra el cielo</td><td>El gato, flores, charcos con reflejo, el primer plano de un paisaje</td></tr>
<tr><td><strong>A la altura de los ojos del sujeto</strong></td><td>Conexión, naturalidad, respeto</td><td><strong>Siempre</strong> para retratos, y muy en especial con tu hija: agachate a su altura</td></tr>
<tr><td><strong>Por encima</strong></td><td>Ordena, muestra el plano, empequeñece</td><td>Mesas, mercados, patrones en el piso</td></tr>
</tbody></table></div>
<div class="note"><p>Si de esta lección te llevás una sola cosa, que sea esta: <strong>para fotografiar a un chico, agachate</strong>. Es la diferencia entre una foto de un chico y una foto desde el mundo de un chico.</p></div>

<h3>Vertical para redes, sin arruinar la foto</h3>
<p>Instagram y las historias viven en vertical 9:16. Pero ya vimos que disparar en 9:16 tira píxeles a la basura. La solución práctica:</p>
<ol>
<li>Disparar en <strong>3:4 vertical</strong>, o sea el teléfono parado, formato nativo completo.</li>
<li>Al componer, dejá un poco de aire arriba y abajo, sabiendo que después vas a recortar a 9:16.</li>
<li>Recortar en la galería a 9:16 cuando lo vayas a publicar.</li>
</ol>
<p>Y una advertencia de composición: en vertical <strong>las líneas guía funcionan distinto</strong>. El formato alto favorece las líneas que entran desde abajo y suben. Un camino que en horizontal cruzaba la escena, en vertical se convierte en una calle que se va hacia el fondo.</p>
`,
eng:`
<p><strong>Por qué una diagonal "mueve" y una horizontal "calma".</strong> En la corteza visual primaria V1 hay poblaciones de neuronas selectivas a la orientación, con sobrerrepresentación de las orientaciones cardinales, horizontal y vertical. Las oblicuas se codifican con menor precisión, el llamado efecto oblicuo, y generan una respuesta menos estable. Esa inestabilidad de codificación es una hipótesis razonable de por qué percibimos las diagonales como dinámicas y las horizontales como estáticas.</p>

<p><strong>Altura de cámara y perspectiva.</strong> Bajar la cámara cambia la posición del punto de fuga y con eso la relación de tamaño aparente entre primer plano y fondo. A 20 cm del piso un objeto a 30 cm subtiende un ángulo enorme y el fondo se comprime detrás: obtenés jerarquía sin tocar la apertura. Es geometría proyectiva pura, y es el único control de perspectiva que tenés en un teléfono, porque la focal la elegís entre cuatro valores fijos.</p>

<p><strong>El costo real del recorte a 9:16.</strong> Un archivo nativo de 12 MP en 3:4 mide 3000 x 4000. Recortarlo a 9:16 conservando el alto deja 2250 x 4000, o sea 9 MP: perdés un 25% del área. Si en cambio disparás directo en 9:16, el ISP hace el mismo recorte pero además pierde esa información antes del apilado HDR, así que entregás menos datos al procesamiento. Disparar ancho y recortar después es estrictamente mejor.</p>
`,

obj:'Elegir el lente por razones de perspectiva, no de comodidad. Entender la compresión del teleobjetivo y la distorsión del gran angular, y saber dónde termina el zoom útil.',
teoria:`
<p>En la lección 1 conociste los cuatro lentes. Ahora vas a aprender a <strong>elegirlos</strong>, que es un asunto completamente distinto. La clave de esta lección es una sola idea, y es contraintuitiva:</p>
<div class="note"><p><strong>El lente no cambia cuánto zoom tenés. Cambia la forma del mundo.</strong></p></div>

<h3>Acercarse con los pies vs. acercarse con el zoom</h3>
<p>Supongamos que querés que la cara de tu esposa llene el mismo espacio en el cuadro. Lo podés lograr de dos maneras: parándote cerca con el 1x, o parándote lejos con el 3x. El tamaño de la cara es igual. <strong>Pero las fotos son totalmente distintas</strong>, y la diferencia está en el fondo y en las proporciones de la cara.</p>
<ul>
<li><strong>Cerca con 1x:</strong> la nariz está mucho más cerca de la cámara que las orejas, así que sale proporcionalmente más grande. El fondo se ve lejano y chico. Resultado: cara distorsionada, fondo amplio.</li>
<li><strong>Lejos con 3x:</strong> la diferencia de distancia entre nariz y orejas es despreciable, la cara sale con proporciones naturales, y el fondo se ve grande y cerca, como una pared detrás del sujeto. Esto es la <strong>compresión</strong>.</li>
</ul>
<p>Por eso el retrato clásico se hace con teleobjetivo: no para "acercarse", sino para que la cara tenga proporciones correctas y el fondo quede simplificado.</p>

<h3>Guía práctica de los cuatro lentes</h3>
<div class="tw"><table>
<thead><tr><th>Lente</th><th>Fuerte en</th><th>Evitalo en</th></tr></thead>
<tbody>
<tr><td><strong>0.6x</strong> (13 mm)</td><td>Paisajes muy amplios, interiores chicos, primeros planos exagerados de un objeto con fondo enorme, grupos en espacio reducido</td><td>Retratos: te deforma la cara. Poca luz: no tiene estabilizador. Objetos a menos de 40 cm: no enfoca.</td></tr>
<tr><td><strong>1x</strong> (24 mm)</td><td>Casi todo. La mejor calidad, el mejor rendimiento en poca luz, el mejor HDR</td><td>Retratos de cara muy cerca: distorsiona. Ahí retrocedé y usá 2x o 3x.</td></tr>
<tr><td><strong>2x</strong> (recorte)</td><td>Retratos de medio cuerpo, detalles, encuadres más ordenados</td><td>Poca luz: el recorte descarta la ventaja del binning y aparece ruido.</td></tr>
<tr><td><strong>3x</strong> (67 mm)</td><td>Retrato de cabeza y hombros, comprimir fondos, detalles a distancia, montañas lejanas</td><td>Interiores y noche: sensor chico, apertura f/2.4, mucho ruido. Ahí es mejor 1x y recortar.</td></tr>
</tbody></table></div>

<h3>Dónde termina el zoom útil</h3>
<p>Tu teléfono deja llevar el zoom a 30x. La pregunta es hasta dónde sigue siendo una foto y no un dibujo.</p>
<ul>
<li><strong>Hasta 3x:</strong> óptica real. Usalo sin miedo.</li>
<li><strong>De 3x a 6x:</strong> recorte del teleobjetivo más reconstrucción por IA. Aceptable para redes sociales con buena luz. Mirá los detalles finos, como el texto o las hojas: ahí se ve la invención.</li>
<li><strong>Más de 10x:</strong> el algoritmo está inventando detalle a partir de muy pocos píxeles. Sirve para identificar algo, no para hacer una foto.</li>
</ul>
<p>Para tu uso, viajes y redes, mi recomendación es un límite práctico: <strong>no pases de 6x</strong>, y cuando necesites más, acercate.</p>

<h3>La distorsión del gran angular y las personas</h3>
<p>El 0.6x estira lo que está cerca de los bordes del cuadro. Si sacás una foto de grupo con el ultra gran angular y tu esposa queda en el borde, va a salir más ancha que en la realidad. Nunca es culpa de la persona. Es culpa de la proyección del lente. Solución: <strong>las personas van al centro del cuadro</strong> cuando usás 0.6x, o mejor, usá 1x y retrocedé.</p>
`,
eng:`
<p><strong>La perspectiva no depende del lente, depende de la distancia.</strong> Esto es lo más importante de la lección y suele explicarse mal. El tamaño relativo entre dos objetos a distancias d1 y d2 de la cámara está dado por la razón d2/d1, y el lente no aparece en esa ecuación. Lo único que hace la focal es determinar el ángulo de visión, o sea cuánto recortás de esa proyección. La llamada "distorsión de gran angular" en un retrato es en realidad el resultado de estar cerca, y la "compresión de teleobjetivo" es el resultado de estar lejos. El lente sólo te obliga a esas distancias si querés un encuadre determinado.</p>

<p><strong>Por qué 0.6x estira los bordes.</strong> Un rectilíneo de 13 mm proyecta la esfera de la escena sobre un plano. Para mantener las líneas rectas rectas, la escala transversal crece con la secante del ángulo respecto del eje óptico. A 60 grados del eje ese factor ya es 2. Un rostro cerca del borde se estira en la dirección radial. Samsung corrige parte de esto con un remapeo de coordenadas, lo que en la app suele llamarse corrección de forma, pero la corrección no puede ser perfecta: si endereza las caras, curva las líneas rectas del fondo. Es un compromiso matemático inevitable, no una carencia de software.</p>

<p><strong>Qué gana y qué pierde el 2x.</strong> Recortar el centro del sensor de 50 MP a la mitad lineal deja 12.5 MP nativos, exactamente la resolución de salida. Con luz abundante el resultado es prácticamente indistinguible de un lente real de 48 mm. Con poca luz perdés el binning 4 a 1, y con él ese paso completo de relación señal a ruido que calculamos en la lección 2. De ahí la regla: 2x de día sí, 2x de noche no.</p>

<p><strong>Qué hace el super resolution zoom.</strong> Entre 3x y 10x el ISP apila varios cuadros con micro-desplazamientos de la mano, que funcionan como un muestreo sub-píxel, y reconstruye una grilla de mayor resolución. Eso es reconstrucción legítima, con base física. Más allá, el sistema pasa a completar con un modelo generativo entrenado: las texturas que ves ya no provienen de fotones de esa escena, sino de un prior estadístico. Técnicamente sigue siendo una imagen, pero deja de ser una medición.</p>
`,

    '¿Probé otra altura de cámara?',
    '¿Hay una línea que lleve el ojo al sujeto?',
    '¿Elegí el lente por la perspectiva que quiero, no por comodidad?',
    '¿Necesito compensar la exposición para esta escena?',
    '¿Vale la pena disparar en 50 MP o en RAW acá?',
    '¿Saqué también una versión vertical?'
  ],
  retrato:[
    '¿Está limpio el lente?',
    '¿Estoy a la altura de los ojos del sujeto?',
    '¿Estoy usando 2x o 3x en lugar de 1x de cerca?',
    '¿De dónde viene la luz y le pega bien en la cara?',
    '¿El fondo está limpio o al menos simplificado?',
    '¿Enfoqué en el ojo más cercano?',
    '¿Bloqueé AE/AF midiendo en la cara?',
    '¿Hay contraluz que me esté oscureciendo el rostro?',
    '¿Le di algo que hacer en lugar de pedirle una pose?',
    '¿Dejé espacio del lado hacia donde mira?',

};
